<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>루미큐브 온라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#f4f1e8; --muted:#a9c3bb; --line:rgba(255,255,255,.12);
  --bg1:#0e2a2b; --bg2:#081a1c; --panel:#143d3b; --panel2:#1a4a47;
  --felt1:#1f7a5c; --felt2:#135a45; --felt3:#0e4636;
  --wood1:#c48a52; --wood2:#9c6533; --wood3:#7a4b23;
  --accent:#ffc93c; --accent2:#ff9f1c; --ok:#3ee08f; --bad:#ff6b6b; --warn:#ffb454;
  --c0:#e23b3b; --c1:#2563eb; --c2:#e08600; --c3:#1e2430;
  --tw:36px; --r:14px;
  --display:"Jua","Pretendard",sans-serif;
}
@media (min-width:700px){:root{--tw:40px}}
@media (min-width:1100px){:root{--tw:44px}}
@media (min-width:1500px){:root{--tw:50px}}
@media (max-width:420px){:root{--tw:30px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overscroll-behavior:none;
  background:radial-gradient(1200px 700px at 50% -10%,#1d4b47 0%,var(--bg1) 45%,var(--bg2) 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:#f2ecda;color:#25302c;font-weight:800;
  box-shadow:0 3px 0 #b9ad8b,0 6px 14px rgba(0,0,0,.25);transition:transform .08s,filter .15s,box-shadow .08s}
button:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #b9ad8b,0 3px 8px rgba(0,0,0,.25)}
button:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.4)}
button.primary{background:linear-gradient(#ffd75e,var(--accent));color:#3a2a00;box-shadow:0 3px 0 #c98f00,0 6px 16px rgba(255,180,0,.28)}
button.go{background:linear-gradient(#5cf0a6,#25c47a);color:#05301c;box-shadow:0 3px 0 #13894f,0 6px 16px rgba(30,200,120,.3)}
button.danger{background:#ffc6c6;box-shadow:0 3px 0 #d98b8b}
button.ghost{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
button.ghost:hover:not(:disabled){background:rgba(255,255,255,.14)}
button.icon{padding:7px 11px;border-radius:10px}
input,select{background:#fbf8ef;color:#1f2a26;border:2px solid transparent;border-radius:10px;padding:9px 11px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
.hidden{display:none!important}
.screen{height:100%;height:100dvh;position:relative}
.card{max-width:620px;margin:0 auto;padding:22px 18px 30px;height:100%;overflow:auto}
h1{margin:4px 0 2px;font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
h2,h3{font-family:var(--display);font-weight:400;margin:0 0 8px}
h3{font-size:20px}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0;line-height:1.5}
.f{display:block;margin:6px 0;font-weight:700;font-size:13px;color:#d8e6e1}
.f select,.f input{margin-top:5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.adv-h{grid-column:1/-1;margin:10px 0 0;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;border-top:1px dashed var(--line);padding-top:10px}
.tabs{display:flex;gap:4px;margin:16px 0 0;background:rgba(0,0,0,.25);padding:5px;border-radius:14px}
.tabs button{flex:1;background:transparent;color:var(--muted);box-shadow:none;padding:9px 6px}
.tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.hero{text-align:center;padding:10px 0 0}
.logo{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.logo .tile{animation:bob 3s ease-in-out infinite;--tw:48px}
.logo .tile:nth-child(2){animation-delay:.2s}.logo .tile:nth-child(3){animation-delay:.4s}.logo .tile:nth-child(4){animation-delay:.6s}.logo .tile:nth-child(5){animation-delay:.8s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.wide{width:100%;padding:13px;font-size:17px}

/* 타일 */
.tile{width:var(--tw);height:calc(var(--tw)*1.36);border-radius:calc(var(--tw)*.17);
  background:linear-gradient(160deg,#fffdf6 0%,#f6efdc 60%,#ece1c4 100%);
  box-shadow:0 calc(var(--tw)*.07) 0 #cbbc94,0 calc(var(--tw)*.1) calc(var(--tw)*.16) rgba(0,0,0,.35),inset 0 1px 0 #fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;flex:0 0 auto;line-height:1;position:relative;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-family:var(--display);font-size:calc(var(--tw)*.66);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.tile small{font-size:calc(var(--tw)*.24);margin-top:calc(var(--tw)*.02);opacity:.85}
.tile.c0{color:var(--c0)}.tile.c1{color:var(--c1)}.tile.c2{color:var(--c2)}.tile.c3{color:var(--c3)}
.tile.joker .n{background:conic-gradient(from 0deg,#e23b3b,#e08600,#2563eb,#1e2430,#e23b3b);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:calc(var(--tw)*.7)}
.tile.joker small{color:#6b4bd1;font-weight:800}
.tile.dragging{opacity:.25}
.tile.recent{box-shadow:0 0 0 3px var(--accent),0 0 14px 2px rgba(255,201,60,.65),0 calc(var(--tw)*.07) 0 #cbbc94}
.tile.hinted{animation:hint 1s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 3px #7cf7ff,0 0 16px 4px rgba(124,247,255,.7),0 3px 0 #cbbc94;transform:translateY(-3px)}50%{box-shadow:0 0 0 2px #7cf7ff,0 0 4px 1px rgba(124,247,255,.3),0 3px 0 #cbbc94;transform:none}}
.tile.mini{--tw:24px;cursor:default}
.tile.mini:hover{transform:none}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:scale(1.15) rotate(-5deg);opacity:.96;filter:drop-shadow(0 12px 10px rgba(0,0,0,.45))}
.tile.pop{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:none}}

/* 게임 화면 */
#s-game{display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px}
.top{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap;backdrop-filter:blur(6px)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:700;color:#dbe9e4;white-space:nowrap}
.top .turn{font-family:var(--display);font-size:20px;padding:4px 16px;border-radius:999px;background:rgba(255,255,255,.06);white-space:nowrap}
.top .turn.mine{background:linear-gradient(#ffd75e,var(--accent));color:#3a2a00;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.55)}50%{box-shadow:0 0 0 8px rgba(255,201,60,0)}}
.top .sp{flex:1}
.tm{font-family:var(--display);font-size:18px}
.tm.warn{color:#fff;background:var(--bad);animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.reacts{display:flex;gap:2px}
.reacts button{padding:4px 7px;font-size:18px;background:transparent;box-shadow:none;border-radius:8px}
.reacts button:hover:not(:disabled){background:rgba(255,255,255,.12)}
.opps{display:flex;gap:8px;overflow-x:auto;padding:2px}
.opp{flex:1;min-width:120px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:14px;padding:7px 10px;display:flex;align-items:center;gap:9px;position:relative;transition:border-color .2s,transform .2s}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;color:#0b1d1c;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.fd .av{width:46px;height:46px;font-size:22px}
.opp .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.opp b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.opp .cnt{display:inline-flex;align-items:center;gap:3px;font-weight:800;color:#f1e9d2}
.opp .cnt::before{content:"";width:10px;height:13px;border-radius:2px;background:linear-gradient(#fffdf6,#e6d9b8);box-shadow:2px -2px 0 rgba(255,255,255,.35)}
.opp .badge{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(62,224,143,.18);color:#8ff0bf;font-weight:700}
.opp .badge.no{background:rgba(255,255,255,.08);color:var(--muted)}
.opp.cur{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 0 0 3px rgba(255,201,60,.18),0 8px 20px rgba(0,0,0,.3)}
.opp .bar{position:absolute;left:8px;right:8px;bottom:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.opp .bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.opp.off{opacity:.5}
.bubble{position:absolute;right:6px;top:-14px;font-size:26px;animation:floaty 2.4s ease-out forwards;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
@keyframes floaty{0%{transform:translateY(8px) scale(.5);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translateY(-22px) scale(1);opacity:0}}
.board{flex:1;min-height:90px;border-radius:20px;padding:16px;overflow:auto;display:flex;flex-wrap:wrap;gap:14px 16px;align-content:flex-start;position:relative;
  background:radial-gradient(ellipse at 50% 40%,var(--felt1) 0%,var(--felt2) 60%,var(--felt3) 100%);
  box-shadow:inset 0 0 0 6px #3b2a1a,inset 0 0 0 9px #6b4a2b,inset 0 0 40px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35)}
.board::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;opacity:.12;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 6px)}
.board.hurry{box-shadow:inset 0 0 0 6px #3b2a1a,inset 0 0 0 9px var(--bad),inset 0 0 40px rgba(0,0,0,.45),0 0 24px rgba(255,107,107,.45);animation:hurry .8s ease-in-out infinite}
@keyframes hurry{50%{box-shadow:inset 0 0 0 6px #3b2a1a,inset 0 0 0 9px #ffb3b3,inset 0 0 40px rgba(0,0,0,.45),0 0 4px rgba(255,107,107,.2)}}
.board .empty{color:rgba(255,255,255,.7);margin:auto;text-align:center;font-size:15px;line-height:1.7;z-index:1}
.board .empty b{color:var(--accent)}
.set{display:flex;flex-wrap:wrap;gap:4px;padding:9px 10px;border-radius:14px;border:2px dashed rgba(255,255,255,.2);background:rgba(0,0,0,.14);align-items:center;position:relative;max-width:100%;z-index:1;transition:background .2s}
.set.ok{border:2px solid rgba(62,224,143,.75);background:rgba(10,60,40,.25)}
.set.bad{border:2px solid var(--bad);background:rgba(255,80,80,.16)}
.set.wip{border-color:var(--warn)}
.set .pts{position:absolute;right:8px;top:-11px;background:var(--ok);color:#06331f;font-size:11px;font-weight:900;border-radius:9px;padding:1px 7px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.set .why{flex-basis:100%;font-size:12px;color:#ffe0e0;font-weight:600}
.set.wip .why{color:#ffe7c2}
.drop-hover{outline:3px dashed var(--accent);outline-offset:3px}
.board.newok .newhint{display:block}
.newhint{display:none;flex-basis:100%;text-align:center;color:rgba(255,255,255,.55);font-size:12.5px;padding:4px;z-index:1}
.grip{cursor:grab;touch-action:none;color:rgba(255,255,255,.5);font-size:20px;line-height:1;padding:0 4px 0 0;align-self:stretch;display:flex;align-items:center;user-select:none}
.grip:hover{color:#fff}
.set.target{box-shadow:0 0 0 3px var(--accent),0 0 18px rgba(255,201,60,.35)}
.set .tgt{position:absolute;left:10px;top:-12px;background:var(--accent);color:#3a2a00;font-size:11px;font-weight:900;border-radius:9px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.set.dragging{opacity:.3}
.set.drag-ghost{transform:rotate(-2deg);background:rgba(14,70,54,.92)}

.dock{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.dock-main{min-width:0}
.dock-top{display:flex;align-items:center;gap:8px;margin:0 2px 6px}
.msg{flex:1;min-height:20px;font-size:14px;font-weight:600;color:#dbe9e4}
.msg.err{color:#ffd0d0}
.msg.good{color:var(--ok)}
.sorts{display:flex;gap:6px}
.sorts button{padding:6px 10px;font-size:13px}
.sorts b{font-family:var(--display);font-weight:400;font-size:15px;margin-right:3px;letter-spacing:-.5px}
.actions{display:flex;flex-direction:column;gap:7px;width:178px}
.actions button{width:100%;padding:10px 12px;font-size:15px}
.actions #b-end{padding:15px 12px;font-size:18px;font-family:var(--display);font-weight:400}
.actions .sub{display:flex;gap:7px}
.actions .sub button{font-size:14px;padding:9px 6px}
.hintbtn{position:relative}
.hintbtn .cnt{position:absolute;top:-7px;right:-6px;background:#7cf7ff;color:#04313a;border-radius:999px;font-size:11px;font-weight:900;padding:1px 6px}
.rack{--cols:10;--sw:min(calc(var(--tw) + 8px),max(30px,calc((100vw - 240px) / var(--cols) - 4px)));--sh:calc((var(--sw) - 8px)*1.36 + 12px);
  background:linear-gradient(180deg,var(--wood1) 0%,var(--wood2) 55%,var(--wood3) 100%);border-radius:16px;padding:10px 10px 14px;overflow-x:auto;overflow-y:hidden;
  display:grid;grid-template-columns:repeat(var(--cols),var(--sw));grid-template-rows:repeat(2,var(--sh));gap:8px 4px;justify-content:safe center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -8px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.4);position:relative}
.rack::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:.16;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 9px)}
.rack .tile{--tw:calc(var(--sw) - 8px)}
.slot{border-radius:9px;background:rgba(60,30,10,.32);box-shadow:inset 0 3px 5px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;border-bottom:3px solid rgba(255,230,190,.22);position:relative}
.slot.drop-hover{outline:3px dashed var(--accent);outline-offset:0}
.tile.fresh{animation:fresh 1.5s ease-out}
@keyframes fresh{0%,40%{box-shadow:0 0 0 4px var(--accent),0 0 16px rgba(255,201,60,.8),0 3px 0 #cbbc94;transform:translateY(-6px)}100%{transform:none}}
@media (max-width:760px){
  .dock{grid-template-columns:1fr}
  .actions{width:auto;flex-direction:row;flex-wrap:wrap}
  .actions button,.actions #b-end{flex:1;width:auto;padding:10px;font-size:14px}
  .actions .sub{flex:2}
  .rack{--sw:min(calc(var(--tw) + 8px),max(28px,calc((100vw - 40px) / var(--cols) - 4px)))}
  #s-game{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .reacts{display:none}
}

/* 모달·토스트·가림막·선 정하기 */
#modal{position:fixed;inset:0;background:rgba(4,14,14,.7);display:flex;align-items:center;justify-content:center;z-index:900;padding:14px;backdrop-filter:blur(3px)}
#modal .box{background:#fbf8ef;color:#1f2a26;border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal .box h3{color:#14403c}
#modal .box button{display:block;width:100%;margin:7px 0}
#modal ul{padding-left:18px;margin:6px 0;line-height:1.65;font-size:14.5px}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-10px);background:rgba(10,22,22,.92);color:#fff;padding:12px 20px;border-radius:14px;z-index:1200;font-weight:700;max-width:92vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#cover,#firstdraw{position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  background:radial-gradient(800px 500px at 50% 40%,#1d4b47,var(--bg2))}
#firstdraw{z-index:850}
#cover .box,#firstdraw .box{max-width:640px}
#cover h2,#firstdraw h2{font-size:34px;margin:0 0 8px}
.fd-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.fd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px;border-radius:16px;background:rgba(255,255,255,.06);border:2px solid transparent;min-width:110px;animation:pop .4s ease-out both}
.fd .tile{--tw:56px}
.fd .tiles{display:flex;gap:6px}
.fd.win{border-color:var(--accent);background:rgba(255,201,60,.12)}
.fd b{font-size:15px}
.fd .tag{font-family:var(--display);color:var(--accent);font-size:17px}

/* 대기실·결과 */
.seat{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin:7px 0}
.seat .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#0b1d1c;flex:0 0 auto}
.seat .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.seat.off .dot{background:#888;box-shadow:none}
.seat.empty{border:2px dashed rgba(255,255,255,.22);background:transparent}
.seat.empty .nm{opacity:.55}
.seat.empty .av{background:rgba(255,255,255,.08);color:var(--muted)}
.seat.bot{background:linear-gradient(180deg,#24435e,#1b3550)}
.seat .nm{flex:1;font-weight:800}
.seat button{padding:6px 12px;font-size:13px}
.codebox{text-align:center;padding:6px 0 4px}
.big{font-family:var(--display);font-size:64px;letter-spacing:10px;color:var(--accent);text-shadow:0 4px 0 #a36d00,0 10px 30px rgba(255,201,60,.3);line-height:1.1}
.sum{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 14px;font-size:14px}
.sum span:nth-child(odd){color:var(--muted)}
.sum span:nth-child(even){font-weight:700}
.podium{display:flex;flex-direction:column;gap:8px}
.rank{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 14px;animation:pop .35s ease-out both}
.rank.win{border:2px solid var(--accent);background:linear-gradient(180deg,#3d4a22,#28401f);box-shadow:0 0 30px rgba(255,201,60,.18)}
.rank .hd{display:flex;gap:10px;align-items:center}
.rank .medal{font-family:var(--display);font-size:24px;width:38px;text-align:center;flex:0 0 auto}
.rank .hd b{font-size:17px}
.rank .sc{margin-left:auto;font-family:var(--display);font-size:24px}
.rank .sc.pos{color:var(--ok)}.rank .sc.neg{color:var(--bad)}
.rank .tiles{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0 0 48px}
table.board-score{width:100%;border-collapse:collapse;font-size:14px}
table.board-score th{color:var(--muted);font-weight:700;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
table.board-score td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
table.board-score td.num{text-align:right;font-weight:800}
table.board-score tr.lead td{color:var(--accent)}

<script>/*!
 * 루미큐브 규칙 엔진 (rk-engine.js)
 * - 화면·네트워크와 무관한 순수 함수 모음. 나중에 단일 HTML 안에 그대로 붙여 넣어 쓴다.
 * - 타일은 정수 id 하나로 표현한다(Firebase에 그대로 저장하기 좋음).
 *     id 0~103  : 숫자 타일 (복사본 2벌)  → 색 = floor((id%52)/13), 숫자 = id%13 + 1
 *     id 104,105: 조커
 * - 세트는 id 배열. 런(연속)은 "배열 순서"가 곧 왼쪽→오른쪽 순서다.
 * - 테이블은 세트의 배열: [[id,id,id], [id,id,id,id], ...]
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RK = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const COLOR_NAMES = ['빨강', '파랑', '노랑', '검정'];
  const JOKER_FIRST = 104;
  const TOTAL_TILES = 106;
  const JOKER_PENALTY = 30;

  /* ---------- 타일 기본 ---------- */
  const isJoker = (id) => id >= JOKER_FIRST;
  const colorOf = (id) => (isJoker(id) ? -1 : Math.floor((id % 52) / 13));
  const numOf = (id) => (isJoker(id) ? 0 : (id % 13) + 1);
  const tileInfo = (id) => ({ id, joker: isJoker(id), color: colorOf(id), number: numOf(id) });
  /** 테스트·디버깅용: makeTile(색0~3, 숫자1~13, 복사본0|1) */
  const makeTile = (color, number, copy) => (copy || 0) * 52 + color * 13 + (number - 1);

  /** jokers: 조커 개수(0~2, 기본 2) */
  function createDeck(jokers) {
    const j = jokers == null ? 2 : jokers;
    const deck = [];
    for (let i = 0; i < 104; i++) deck.push(i);
    for (let k = 0; k < j; k++) deck.push(JOKER_FIRST + k);
    return deck;
  }

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    const r = rng || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- 세트 판정 ---------- */
  function evalRun(ids) {
    const len = ids.length;
    if (len < 3 || len > 13) return null;
    let color = null;
    let start = null;
    for (let i = 0; i < len; i++) {
      const id = ids[i];
      if (isJoker(id)) continue;
      const c = colorOf(id);
      const s = numOf(id) - i; // 이 위치가 시작 숫자라면 필요한 값
      if (color === null) {
        color = c;
        start = s;
      } else if (c !== color || s !== start) return null;
    }
    if (color === null) return null; // 조커만 있는 런은 불가
    if (start < 1 || start + len - 1 > 13) return null; // 13 다음 1로 이어지는 것도 불가
    let points = 0;
    for (let i = 0; i < len; i++) points += start + i;
    return { kind: 'run', points, color, start };
  }

  function evalGroup(ids) {
    const len = ids.length;
    if (len < 3 || len > 4) return null;
    let num = null;
    const colors = new Set();
    for (const id of ids) {
      if (isJoker(id)) continue;
      const n = numOf(id);
      if (num === null) num = n;
      else if (n !== num) return null;
      const c = colorOf(id);
      if (colors.has(c)) return null;
      colors.add(c);
    }
    if (num === null) return null; // 조커만 있는 그룹은 불가
    return { kind: 'group', points: num * len, number: num };
  }

  function explainInvalid(ids) {
    const len = ids.length;
    if (len < 3) return '타일이 3장 이상 있어야 해요';
    const real = ids.filter((id) => !isJoker(id));
    if (real.length === 0) return '조커만으로는 세트를 만들 수 없어요';
    const nums = new Set(real.map(numOf));
    const cols = new Set(real.map(colorOf));
    if (nums.size === 1) {
      if (len > 4) return '그룹은 최대 4장까지예요';
      if (cols.size < real.length) return '그룹에는 같은 색이 두 번 들어갈 수 없어요';
    }
    if (cols.size === 1) return '같은 색이지만 숫자가 이어지지 않아요 (1~13, 13 다음에 1은 안 돼요)';
    return '같은 색 연속 숫자(런)도, 같은 숫자 다른 색(그룹)도 아니에요';
  }

  /** 세트 하나를 판정. 런·그룹 둘 다 가능하면 점수가 높은 쪽을 택한다. */
  function validateSet(ids) {
    if (new Set(ids).size !== ids.length) {
      return { valid: false, reason: '같은 타일이 중복되어 있어요' };
    }
    const run = evalRun(ids);
    const group = evalGroup(ids);
    let best = null;
    if (run && group) best = run.points >= group.points ? run : group;
    else best = run || group;
    if (!best) return { valid: false, reason: explainInvalid(ids) };
    return Object.assign({ valid: true }, best);
  }

  const compact = (table) => table.filter((s) => s.length > 0);

  function validateTable(table) {
    const sets = compact(table);
    const results = sets.map(validateSet);
    const bad = [];
    results.forEach((r, i) => {
      if (!r.valid) bad.push(i);
    });
    return { ok: bad.length === 0, results, bad };
  }

  /* ---------- 차례 검증 ---------- */
  const err = (code, message, extra) => Object.assign({ ok: false, code, message }, extra || {});
  const flat = (table) => table.reduce((a, s) => a.concat(s), []);
  const keyOf = (set) => set.slice().sort((a, b) => a - b).join(',');

  /**
   * 한 차례의 결과가 규칙에 맞는지 검사한다.
   * @param {object} p
   *   tableBefore/tableAfter : 차례 시작/종료 시 테이블
   *   handBefore/handAfter   : 차례 시작/종료 시 내 패
   *   melded                 : 이미 첫 등록을 마쳤는가
   *   minMeld                : 첫 등록 최소 점수(기본 30)
   */
  function validateTurn(p) {
    const minMeld = p.minMeld == null ? 30 : p.minMeld;
    const tableBefore = compact(p.tableBefore);
    const tableAfter = compact(p.tableAfter);
    const before = flat(tableBefore);
    const after = flat(tableAfter);

    if (new Set(after).size !== after.length) return err('DUPLICATE', '같은 타일이 두 번 쓰였어요');
    if (new Set(p.handAfter).size !== p.handAfter.length) return err('DUPLICATE', '내 패에 같은 타일이 중복돼요');

    const afterSet = new Set(after);
    for (const id of before) {
      if (!afterSet.has(id)) return err('TABLE_TILE_REMOVED', '테이블의 타일을 패로 가져올 수 없어요');
    }

    const beforeSet = new Set(before);
    const placed = after.filter((id) => !beforeSet.has(id));
    const handBeforeSet = new Set(p.handBefore);
    for (const id of placed) {
      if (!handBeforeSet.has(id)) return err('FOREIGN_TILE', '내 패에 없던 타일이 테이블에 올라왔어요');
    }
    const placedSet = new Set(placed);
    const expectedHand = p.handBefore.filter((id) => !placedSet.has(id));
    const handAfterSet = new Set(p.handAfter);
    if (expectedHand.length !== p.handAfter.length || expectedHand.some((id) => !handAfterSet.has(id))) {
      return err('HAND_MISMATCH', '패와 테이블의 타일이 서로 맞지 않아요');
    }

    if (placed.length === 0) return err('NO_TILE_PLACED', '타일을 1장 이상 내야 해요 (낼 수 없으면 타일을 뽑으세요)');

    const tv = validateTable(tableAfter);
    if (!tv.ok) {
      const i = tv.bad[0];
      return err('INVALID_SET', tv.results[i].reason, { badSets: tv.bad });
    }

    let meldPoints = null;
    if (!p.melded) {
      // 첫 등록: 테이블 세트는 건드릴 수 없고, 내 패의 타일만으로 만든 새 세트의 합이 minMeld 이상
      const left = new Map();
      for (const s of tableBefore) {
        const k = keyOf(s);
        left.set(k, (left.get(k) || 0) + 1);
      }
      const untouchedLeft = new Map(left);
      const newSets = [];
      for (const s of tableAfter) {
        const k = keyOf(s);
        if ((untouchedLeft.get(k) || 0) > 0) untouchedLeft.set(k, untouchedLeft.get(k) - 1);
        else newSets.push(s);
      }
      for (const n of untouchedLeft.values()) {
        if (n > 0) return err('MELD_TOUCHED_TABLE', '첫 등록 전에는 테이블의 세트를 바꿀 수 없어요');
      }
      meldPoints = newSets.reduce((sum, s) => sum + validateSet(s).points, 0);
      if (meldPoints < minMeld) {
        return err('MELD_TOO_LOW', `첫 등록은 ${minMeld}점 이상이어야 해요 (지금 ${meldPoints}점)`, { meldPoints });
      }
    }
    return { ok: true, placed, meldPoints, handEmpty: p.handAfter.length === 0 };
  }

  /* ---------- 화면용 보조 함수 ---------- */
  /**
   * 첫 등록 점수를 실시간으로 계산: 테이블 세트가 그대로인 것은 제외하고 새로 만든 세트의 합.
   * touched = 처음 있던 세트를 건드렸는지(첫 등록 전에는 불가)
   */
  function meldPointsOf(tableBefore, tableAfter) {
    const left = new Map();
    for (const s of compact(tableBefore)) {
      const k = keyOf(s);
      left.set(k, (left.get(k) || 0) + 1);
    }
    let points = 0;
    let newCount = 0;
    for (const s of compact(tableAfter)) {
      const k = keyOf(s);
      if ((left.get(k) || 0) > 0) left.set(k, left.get(k) - 1);
      else {
        const v = validateSet(s);
        if (v.valid) points += v.points;
        newCount++;
      }
    }
    let touched = false;
    for (const n of left.values()) if (n > 0) touched = true;
    return { points, touched, newCount };
  }

  /**
   * 타일 하나를 옮긴 뒤의 작업 상태를 돌려준다. 옮길 수 없거나 변화가 없으면 null.
   * work = {table, hand}
   * dest = {type:'hand'|'new'|'set', setIndex?, beforeId?}  (beforeId: 이 타일 앞에 끼워 넣기, 없으면 맨 뒤)
   * locked = 이번 차례 시작 때 이미 테이블에 있던 타일 id 집합(패로 되돌릴 수 없음)
   */
  function moveTile(work, id, dest, locked) {
    const table = work.table.map((s) => s.slice());
    const hand = work.hand.slice();
    let found = false;
    const hi = hand.indexOf(id);
    if (hi >= 0) {
      hand.splice(hi, 1);
      found = true;
    } else {
      for (let i = 0; i < table.length && !found; i++) {
        const k = table[i].indexOf(id);
        if (k >= 0) {
          table[i].splice(k, 1);
          found = true;
        }
      }
    }
    if (!found) return null;
    if (dest.beforeId === id) return null;
    const insert = (arr, beforeId) => {
      const k = beforeId == null ? -1 : arr.indexOf(beforeId);
      if (k < 0) arr.push(id);
      else arr.splice(k, 0, id);
    };
    if (dest.type === 'hand') {
      if (locked && locked.has(id)) return null;
      insert(hand, dest.beforeId);
    } else if (dest.type === 'new') {
      table.push([id]);
    } else if (dest.type === 'set') {
      const s = table[dest.setIndex];
      if (!s) return null;
      insert(s, dest.beforeId);
    } else return null;
    return { table: table.filter((s) => s.length > 0), hand };
  }

  /**

    s.winner = w;
    s.endReason = reason;
    return s;

  const J = JSON.stringify;
  const P = JSON.parse;
  const GRACE_MS = 6000; // 시간 초과 후 다른 사람이 대신 넘겨주기까지 기다리는 시간

  const pick = (v, list, d) => (list.indexOf(Number(v)) >= 0 ? Number(v) : d);

  function sanitizeSettings(s, allowSolo) {
    const x = s || {};
    return {
      players: pick(x.players, allowSolo ? [1, 2, 3, 4] : [2, 3, 4], 4),
      minMeld: pick(x.minMeld, [0, 20, 30], 30),
      jokers: pick(x.jokers, [0, 2], 2),
      handSize: pick(x.handSize, [10, 14], 14),
      turnSec: pick(x.turnSec, [0, 60, 90, 120], 90),
      totalMin: pick(x.totalMin, [0, 20, 30, 40], 30),
      aiLevel: pick(x.aiLevel, [1, 2, 3], 2),
      timeoutDraw: pick(x.timeoutDraw, [1, 3], 1),   // 시간 안에 정리를 못 끝내면 뽑을 장수(공식 3장)
      autoSubmit: pick(x.autoSubmit, [0, 1], 1),     // 시간이 끝날 때 테이블이 올바르면 자동 제출
      hints: pick(x.hints, [0, 3, 99], 3),           // 한 판에 쓸 수 있는 힌트 수(99 = 무제한)
      reactions: pick(x.reactions, [0, 1], 1),       // 반응 버튼
    };
  }
  /** 컴퓨터가 '생각하는' 시간(1.5~3초) */
  const thinkMs = (seq) => 1500 + ((seq * 7919) % 1500);

  function createNet(fb, RK, opts) {
    const o = opts || {};
    const AI = o.AI || (typeof self !== 'undefined' ? self.RKAI : null);
    const cid = o.cid;
    const clock = o.now || (() => Date.now());
    let code = null;
    let seat = null;
    let room = null;
    let loaded = false; // 방 데이터 첫 수신 여부 (Firebase는 첫 데이터가 비동기로 도착함)
    let myHandStr = null;
    let offset = 0;
    let unsubs = [];
    let busy = false;
    const subs = new Set();

    const now = () => clock() + offset;
    const base = (c) => 'rummikub/rooms/' + (c || code);
    const handPath = (s, c) => 'rummikub/hands/' + (c || code) + '/' + s;

    /* ----- 화면에 넘기는 view ----- */
    function buildView() {
      if (!room || !room.meta) return { status: loaded ? 'gone' : 'loading', mySeat: seat, code };
      const meta = room.meta;
      const st = meta.settings;
      const seats = [];
      for (let i = 0; i < st.players; i++) {
        const s = room.seats && room.seats[i];
        seats.push(s ? { name: s.name, online: !!s.online, bot: !!s.bot, ai: !!s.ai } : null);
      }
      const v = {
        code,
        roomName: meta.roomName || '',
        hasPw: !!meta.pw,
        settings: st,
        status: meta.status,
        seats,
        mySeat: seat,
        isHost: meta.hostCid === cid,
        myHand: myHandStr ? P(myHandStr) : [],
        game: null,
        pool: null,
        history: room.historyJson ? P(room.historyJson) : [],
        react: room.react || null,
      };
      if (room.game && room.poolJson) {
        const g = room.game;
        const pool = P(room.poolJson);
        v.pool = pool;
        v.game = {
          seq: g.seq,
          turn: g.turn,
          turnStartedAt: g.turnStartedAt,
          endsAt: g.endsAt,
          table: P(g.tableJson),
          melded: P(g.meldedJson),
          counts: P(g.countsJson),
          poolPos: g.poolPos,
          poolLeft: pool.length - g.poolPos,
          passes: g.passes,
          lastPlaced: P(g.lastPlacedJson),
          winner: g.winner,
          endReason: g.endReason,
          scores: P(g.scoresJson),
          finalHands: P(g.finalHandsJson),
          firstDraw: g.firstDrawJson ? P(g.firstDrawJson) : null,
          gameId: g.gameId || '',
        };
      }
      return v;
    }

    function emit() {
      const v = buildView();
      subs.forEach((f) => f(v));
    }

    /* ----- 접속 상태 ----- */
    let marking = false;
    function markOnline() {
      if (seat == null || !code || marking) return;
      marking = true;
      Promise.resolve(fb.update(base() + '/seats/' + seat, { online: true, ai: null }))
        .then(() => fb.onDisconnectSet(base() + '/seats/' + seat + '/online', false))
        .catch(() => {})
        .then(() => {
          marking = false;
        });
    }

    function attach(c, s) {
      detach();
      code = c;
      seat = s;
      unsubs.push(
        fb.onValue(base(), (val) => {
          loaded = true;
          room = val;
          const me = room && room.seats && room.seats[seat];
          if (me && me.cid === cid && me.online !== true) markOnline();
          emit();
        })
      );
      unsubs.push(
        fb.onValue(handPath(seat), (val) => {
          myHandStr = val;
          emit();
        })
      );
      unsubs.push(fb.onValue('.info/serverTimeOffset', (val) => (offset = val || 0)));
      unsubs.push(
        fb.onValue('.info/connected', (val) => {
          if (val) markOnline();
        })
      );
    }

    function detach() {
      unsubs.forEach((u) => {
        try {
          u();
        } catch (e) {}
      });
      unsubs = [];
      room = null;
      loaded = false;
      myHandStr = null;
    }

    /* ----- 방 만들기 / 입장 ----- */
    async function createRoom(p) {
      const st = sanitizeSettings(p.settings);
      for (let i = 0; i < 30; i++) {
        const c = String(1000 + Math.floor(Math.random() * 9000));
        const meta = {
          roomName: p.roomName || null,
          pw: p.pw || null,
          hostCid: cid,
          status: 'lobby',
          createdAt: now(),
          settings: st,
        };
        const r = await fb.transaction(base(c) + '/meta', (cur) => (cur ? undefined : meta));
        if (r.committed) {
          await fb.set(base(c) + '/seats/0', { name: p.name, cid, online: true });
          attach(c, 0);
          return { code: c, seat: 0 };
        }
      }
      throw new Error('방 코드를 만들지 못했어요. 잠시 뒤에 다시 시도해 주세요');
    }

    async function joinRoom(p) {
      const c = String(p.code || '').trim();
      const meta = await fb.get(base(c) + '/meta');
      if (!meta) throw new Error('그런 방이 없어요. 코드를 다시 확인해 주세요');
      if (meta.pw && meta.pw !== p.pw) throw new Error('비밀번호가 달라요');
      const seatsObj = (await fb.get(base(c) + '/seats')) || {};
      const n = meta.settings.players;
      // 같은 기기로 다시 들어온 경우
      for (let i = 0; i < n; i++) {
        if (seatsObj[i] && seatsObj[i].cid === cid) {
          attach(c, i);
          return { code: c, seat: i };
        }
      }
      if (meta.status !== 'lobby') {
        // 진행 중에는 접속이 끊긴 같은 이름의 자리만 이어받을 수 있음
        for (let i = 0; i < n; i++) {
          const s = seatsObj[i];
          if (s && s.name === p.name && !s.online) {
            const r = await fb.transaction(base(c) + '/seats/' + i, (cur) =>
              cur && cur.name === p.name && !cur.online ? { name: cur.name, cid, online: true } : undefined
            );
            if (r.committed) {
              attach(c, i);
              return { code: c, seat: i };
            }
          }
        }
        throw new Error('이미 시작된 방이에요 (끊긴 자리와 같은 이름이면 다시 들어갈 수 있어요)');
      }
      for (let i = 0; i < n; i++) {
        if (seatsObj[i]) continue;
        const r = await fb.transaction(base(c) + '/seats/' + i, (cur) => (cur ? undefined : { name: p.name, cid, online: true }));
        if (r.committed) {
          attach(c, i);
          return { code: c, seat: i };
        }
      }
      throw new Error('방이 가득 찼어요');
    }

    async function resume(sess) {
      const meta = await fb.get(base(sess.code) + '/meta');
      if (!meta) throw new Error('방이 없어졌어요');
      const s = await fb.get(base(sess.code) + '/seats/' + sess.seat);
      if (!s || s.cid !== cid) throw new Error('자리를 찾을 수 없어요');
      attach(sess.code, sess.seat);
      return { code: sess.code, seat: sess.seat };
    }

    /* ----- 대기실 ----- */
    async function updateSettings(s) {
      const v = buildView();
      if (!v.isHost || v.status !== 'lobby') throw new Error('방장만, 시작 전에만 바꿀 수 있어요');
      const st = sanitizeSettings(s);
      const joined = v.seats.filter(Boolean).length;
      if (st.players < joined) throw new Error('이미 ' + joined + '명이 들어와 있어서 인원을 그보다 줄일 수 없어요');
      const upd = {};
      upd[base() + '/meta/settings'] = st;
      await fb.update('', upd);
    }

    async function kick(i) {
      const v = buildView();
      if (!v.isHost || v.status !== 'lobby' || i === seat) return;
      await fb.set(base() + '/seats/' + i, null);
    }

    async function addBot(i) {
      const v = buildView();
      if (!v.isHost || v.status !== 'lobby' || i < 0 || i >= v.settings.players) return;
      await fb.transaction(base() + '/seats/' + i, (cur) => (cur ? undefined : { name: '컴퓨터' + (i + 1), cid: 'bot-' + i, online: true, bot: true }));
    }
    async function fillBots() {
      const v = buildView();
      for (let i = 0; i < v.seats.length; i++) if (!v.seats[i]) await addBot(i);
    }
    /** 게임 중 접속이 끊긴 사람 자리를 컴퓨터가 대신 두게 함(다시 들어오면 돌려받음) */
    async function takeoverOffline() {
      const v = buildView();
      if (!v.isHost || v.status !== 'playing') return 0;
      const upd = {};
      v.seats.forEach((s, i) => { if (s && !s.bot && !s.online && !s.ai) upd[base() + '/seats/' + i + '/ai'] = true; });
      const n = Object.keys(upd).length;
      if (n) await fb.update('', upd);
      return n;
    }

    async function startGame() {
      const v = buildView();
      if (!v.isHost || v.status !== 'lobby') throw new Error('방장만 시작할 수 있어요');
      const st = v.settings;
      if (v.seats.filter(Boolean).length !== st.players) throw new Error('모든 자리가 차야 시작할 수 있어요');
      const first = RK.drawForFirst(st.players, Math.random);
      const g = RK.newGame({ players: st.players, minMeld: st.minMeld, jokers: st.jokers, handSize: st.handSize, first: first.first });
      const t = now();
      const upd = {};
      upd[base() + '/poolJson'] = J(g.pool);
      g.hands.forEach((h, i) => {
        upd[handPath(i)] = J(h);
      });
      upd[base() + '/game'] = {
        seq: 1,
        turn: first.first,
        firstDrawJson: J(first.tiles),
        gameId: Math.random().toString(36).slice(2, 10),
        turnStartedAt: t,
        endsAt: st.totalMin ? t + st.totalMin * 60000 : 0,
        tableJson: '[]',
        meldedJson: J(new Array(st.players).fill(false)),
        countsJson: J(g.hands.map((h) => h.length)),
        poolPos: 0,
        passes: 0,
        lastPlacedJson: '[]',
        winner: -1,
        endReason: 'none',
        scoresJson: 'null',
        finalHandsJson: 'null',
      };
      upd[base() + '/meta/status'] = 'playing';
      await fb.update('', upd);
    }

    async function rematch() {
      const v = buildView();
      if (!v.isHost || v.status !== 'over') return;
      const upd = {};
      upd[base() + '/meta/status'] = 'lobby';
      upd[base() + '/game'] = null;
      upd[base() + '/poolJson'] = null;
      upd['rummikub/hands/' + code] = null;
      await fb.update('', upd);
    }

    async function leave() {
      const v = buildView();
      const c = code;
      const s = seat;
      // 먼저 구독을 끊는다 (끊지 않으면 '접속 중'으로 되돌리는 코드가 다시 돌아 자리가 계속 접속 상태로 남음)
      detach();
      code = null;
      seat = null;
      emit();
      if (!c || s == null) return;
      if (v.status === 'lobby') {
        await fb.set(base(c) + '/seats/' + s, null);
        if (v.isHost) {
          const others = await fb.get(base(c) + '/seats');
          const ids = others ? Object.keys(others).filter((k) => !others[k].bot) : [];
          const upd = {};
          if (ids.length === 0) {
            upd[base(c)] = null;
            upd['rummikub/hands/' + c] = null;
          } else {
            upd[base(c) + '/meta/hostCid'] = others[ids[0]].cid;
          }
          await fb.update('', upd);
        }
      } else {
        try {
          await fb.set(base(c) + '/seats/' + s + '/online', false);
        } catch (e) {}
      }
    }

    /* ----- 게임 진행 ----- */
    async function readAllHands(n, overrideSeat, overrideHand) {
      const out = [];
      for (let i = 0; i < n; i++) {
        if (i === overrideSeat) out.push(overrideHand);
        else {
          const s = await fb.get(handPath(i));
          out.push(s ? P(s) : []);
        }
      }
      return out;
    }

    /** 차례 끝내기: 규칙 검사 → 테이블/차례 갱신 → 패 저장 (target: 둘 자리, 컴퓨터 자리도 가능) */
    async function commitFor(target, table, hand) {
      const seat_ = target;
      const v = buildView();
      const g = v.game;
      if (!g || v.status !== 'playing' || g.turn !== target) return { ok: false, message: '지금은 내 차례가 아니에요' };
      let handBefore = v.myHand;
      if (target !== seat) { const hs = await fb.get(handPath(target)); handBefore = hs ? P(hs) : []; }
      const chk = RK.validateTurn({
        tableBefore: g.table,
        handBefore,
        tableAfter: table,
        handAfter: hand,
        melded: g.melded[seat_],
        minMeld: v.settings.minMeld,
      });
      if (!chk.ok) return { ok: false, message: chk.message, badSets: chk.badSets, code: chk.code };

      const players = v.settings.players;
      const compactTable = table.filter((s) => s.length > 0);
      const counts = g.counts.slice();
      counts[seat_] = hand.length;
      const melded = g.melded.slice();
      melded[seat_] = true;
      let over = null;
      if (hand.length === 0) {
        const hands = await readAllHands(players, seat_, hand);
        over = { scores: RK.roundScores(hands, seat_), hands };
      }
      const t = now();
      const prevHand = myHandStr;
      if (seat_ === seat) myHandStr = J(hand); // 화면 깜빡임 방지: 내 패를 먼저 반영
      const res = await fb.transaction(base() + '/game', (cur) => {
        if (!cur || cur.seq !== g.seq || cur.turn !== seat_) return undefined;
        const n = Object.assign({}, cur, {
          seq: cur.seq + 1,
          tableJson: J(compactTable),
          meldedJson: J(melded),
          countsJson: J(counts),
          passes: 0,
          lastPlacedJson: J(chk.placed),
        });
        if (over) {
          n.winner = seat_;
          n.endReason = 'empty';
          n.scoresJson = J(over.scores);
          n.finalHandsJson = J(over.hands);
        } else {
          n.turn = (seat_ + 1) % players;
          n.turnStartedAt = t;
        }
        return n;
      });
      if (!res.committed) {
        myHandStr = prevHand;
        emit();
        return { ok: false, message: '그 사이에 차례가 바뀌었어요 (시간이 지났을 수 있어요)' };
      }
      const upd = {};
      upd[handPath(seat_)] = J(hand);
      if (over) upd[base() + '/meta/status'] = 'over';
      await fb.update('', upd);
      if (over) await appendHistory(over.scores, seat_, 'empty');
      return { ok: true };
    }

    /** target 자리의 차례를 "1장 뽑고 넘김"으로 처리 (본인 또는 대신 넘겨주는 사람이 호출) */
    async function passFor(target, nDraw) {
      const v = buildView();
      const g = v.game;
      if (!g || v.status !== 'playing' || g.turn !== target) return { ok: false, message: '지금은 그 사람의 차례가 아니에요' };
      const st = v.settings;
      const pool = v.pool;
      const drawn = pool.slice(g.poolPos, g.poolPos + (nDraw || 1));
      const drawId = drawn.length ? drawn[0] : null;
      let hand;
      if (target === seat) hand = v.myHand.slice();
      else {
        const s = await fb.get(handPath(target));
        hand = s ? P(s) : [];
      }
      const newHand = hand.concat(drawn);
      let over = null;
      if (drawId === null && g.passes + 1 >= st.players) {
        const hands = await readAllHands(st.players, target, newHand);
        const fin = RK.finishByScore({ players: st.players, hands }, 'stalemate');
        over = { winner: fin.winner, scores: RK.roundScores(hands, fin.winner), hands };
      }
      const counts = g.counts.slice();
      counts[target] += drawn.length;
      const t = now();
      const prevHand = myHandStr;
      if (target === seat && drawId !== null) myHandStr = J(newHand);
      const res = await fb.transaction(base() + '/game', (cur) => {
        if (!cur || cur.seq !== g.seq || cur.turn !== target) return undefined;
        const n = Object.assign({}, cur, {
          seq: cur.seq + 1,
          countsJson: J(counts),
          lastPlacedJson: '[]',
          poolPos: cur.poolPos + drawn.length,
          passes: drawId !== null ? 0 : cur.passes + 1,
        });
        if (over) {
          n.winner = over.winner;
          n.endReason = 'stalemate';
          n.scoresJson = J(over.scores);
          n.finalHandsJson = J(over.hands);
        } else {
          n.turn = (target + 1) % st.players;
          n.turnStartedAt = t;
        }
        return n;
      });
      if (!res.committed) {
        myHandStr = prevHand;
        emit();
        return { ok: false, message: '그 사이에 차례가 바뀌었어요' };
      }
      const upd = {};
      if (drawId !== null) upd[handPath(target)] = J(newHand);
      if (over) upd[base() + '/meta/status'] = 'over';
      if (Object.keys(upd).length) await fb.update('', upd);
      if (over) await appendHistory(over.scores, over.winner, 'stalemate');
      return { ok: true, drew: drawn.length, drawn: target === seat ? drawn : null };
    }

    /** 누적 점수표에 한 판 결과 추가 (이름 기준으로 모음) */
    async function appendHistory(scores, winner, reason) {
      const v = buildView();
      const names = v.seats.map((x) => (x ? x.name : '?'));
      const bots = v.seats.map((x) => !!(x && x.bot));
      const entry = { n: names, b: bots, s: scores, w: winner, r: reason };
      try {
        await fb.transaction(base() + '/historyJson', (cur) => {
          const arr = cur ? P(cur) : [];
          arr.push(entry);
          return J(arr.slice(-60));
        });
      } catch (e) {}
    }
    async function resetHistory() {
      const v = buildView();
      if (!v.isHost) return;
      await fb.set(base() + '/historyJson', null);
    }
    let lastReact = 0;
    async function react(e) {
      const v = buildView();
      if (!v.settings || !v.settings.reactions || seat == null || v.status !== 'playing') return;
      if (now() - lastReact < 1500) return;
      lastReact = now();
      await fb.set(base() + '/react', { s: seat, e: String(e).slice(0, 4), t: now() });
    }

    /** 시간 종료/방장 종료: 감점이 가장 낮은 사람이 승리 */
    async function finishByScore(reason) {
      const v = buildView();
      const g = v.game;
      if (!g || v.status !== 'playing') return { ok: false };
      const st = v.settings;
      const hands = await readAllHands(st.players, null, null);
      const fin = RK.finishByScore({ players: st.players, hands }, reason);
      const scores = RK.roundScores(hands, fin.winner);
      const res = await fb.transaction(base() + '/game', (cur) => {
        if (!cur || cur.seq !== g.seq || cur.winner !== -1) return undefined;
        return Object.assign({}, cur, {
          seq: cur.seq + 1,
          winner: fin.winner,
          endReason: reason,
          scoresJson: J(scores),
          finalHandsJson: J(hands),
        });
      });
      if (!res.committed) return { ok: false };
      const upd = {};
      upd[base() + '/meta/status'] = 'over';
      await fb.update('', upd);
      await appendHistory(scores, fin.winner, reason);
      return { ok: true };
    }

    /**
     * 내 차례 시간이 끝났을 때
     * - 자동 제출이 켜져 있고, 지금 테이블이 올바르면 그대로 제출
     * - 무언가 옮기다가 못 끝냈으면 원상복구 + 벌칙 장수(설정, 공식 3장), 아무것도 안 했으면 1장
     */
    async function myTimeout() {
      const v = buildView();
      const w = o.getWork ? o.getWork() : null;
      const dirty = !!(w && w.dirty);
      if (dirty && v.settings.autoSubmit) {
        const r = await commitFor(seat, w.table, w.hand);
        if (r.ok) return Object.assign(r, { auto: 'submitted' });
      }
      const n = dirty ? v.settings.timeoutDraw : 1;
      const r = await passFor(seat, n);
      return Object.assign(r, { auto: dirty ? 'penalty' : 'draw' });
    }

    /** 컴퓨터 차례: 수를 계산해 두고, 낼 수 없으면 뽑고 넘김 */
    async function runAI(target) {
      const v = buildView();
      const g = v.game;
      if (!g || g.turn !== target || !AI) return passFor(target);
      const hs = await fb.get(handPath(target));
      const hand = hs ? P(hs) : [];
      const mv = AI.chooseMove({ table: g.table, hand, melded: g.melded[target], minMeld: v.settings.minMeld, level: v.settings.aiLevel });
      if (mv) {
        const r = await commitFor(target, mv.table, mv.hand);
        if (r.ok) return r;
      }
      return passFor(target);
    }

    /** 1초마다 불러 주세요: 내 시간초과 처리, 끊긴 사람 대신 넘기기, 컴퓨터 차례 두기, 총 제한시간 종료 */
    function tick() {
      if (busy || seat == null) return;
      const v = buildView();
      if (v.status !== 'playing' || !v.game) return;
      const g = v.game;
      const st = v.settings;
      const t = now();
      // 실행 담당: 접속 중인 사람(컴퓨터 제외) 중 번호가 가장 빠른 사람
      const online = [];
      v.seats.forEach((s, i) => {
        if (s && s.online && !s.bot) online.push(i);
      });
      const cur = v.seats[g.turn];
      const aiTurn = !!(cur && (cur.bot || cur.ai));
      const lowest = (ex) => {
        const c = online.filter((i) => i !== ex);
        return c.length ? Math.min.apply(null, c) : -1;
      };
      let job = null;
      if (g.endsAt && t >= g.endsAt && seat === lowest(-1)) job = () => finishByScore('timeup');
      else if (aiTurn) {
        if (seat === lowest(-1) && t >= g.turnStartedAt + thinkMs(g.seq)) job = () => runAI(g.turn);
      } else if (st.turnSec > 0) {
        const dl = g.turnStartedAt + st.turnSec * 1000;
        if (g.turn === seat && t >= dl) job = () => myTimeout();
        else if (g.turn !== seat && t >= dl + GRACE_MS && seat === lowest(g.turn)) job = () => passFor(g.turn);
      }
      if (job) {
        busy = true;
        Promise.resolve(job())
          .catch(() => {})
          .then((r) => {
            busy = false;
            if (r && r.auto && api.onAuto) api.onAuto(r);
          });
      }
    }

    const api = {
      createRoom, joinRoom, resume, leave,
      updateSettings, kick, startGame, rematch,
      commit: (table, hand) => commitFor(seat, table, hand),
      addBot, fillBots, takeoverOffline, resetHistory, react,
      drawPass: () => passFor(seat),
      forcePass: () => {
        const v = buildView();
        return v.isHost && v.game ? passFor(v.game.turn) : Promise.resolve({ ok: false });
      },
      endGame: () => {
        const v = buildView();
        return v.isHost ? finishByScore('host') : Promise.resolve({ ok: false });
      },
      tick,
      now,
      onAuto: null,
      getView: buildView,
      subscribe: (f) => {
        subs.add(f);
        return () => subs.delete(f);
      },
      get code() { return code; },
      get seat() { return seat; },
    };
    return api;
  }

  return { createNet, sanitizeSettings, thinkMs };
});

  function makeLocal(settings) {

          if (dirty && st.autoSubmit) {
            const r = RK.commitTurn(state, work.table, work.hand);
            if (r.ok) { state = r.state; lastPlaced = r.result.placed; after(); if (api.onAuto) api.onAuto({ auto: 'submitted' }); return; }
          }
          state = RK.drawAndPass(state, dirty ? st.timeoutDraw : 1).state; lastPlaced = []; after();
          if (api.onAuto) api.onAuto({ auto });
        }
      },
      async endGame() { if (!state.over) { state = RK.finishByScore(state, 'host'); after(); } },
      async rematch() { init(); emit(); },
      async resetHistory() { history.length = 0; emit(); },
      async react() {},
      async leave() {},
      forcePass() {},
      _debugSetHand(seat, hand) { state.hands[seat] = hand.slice(); emit(); },
    };
    return api;
  }

  /* ================= 화면 연결 ================= */
  function attach(c) {
    if (unsub) unsub();
    ctl = c;
    c.onAuto = (r) => {
      const m = { submitted: '⏱ 시간이 끝나서, 올바르게 놓은 타일을 자동으로 냈어요', penalty: '⏱ 시간 안에 정리를 못 끝내서 원래대로 돌리고 ' + (view && view.settings.timeoutDraw) + '장을 뽑았어요', draw: '⏱ 시간이 끝나서 1장을 뽑고 넘겼어요' }[r.auto];
      if (m) toast(m, 3500);
    };
    unsub = c.subscribe(onView);
    onView(c.getView());
  }
  function goHome(msg) {
    if (unsub) unsub();
    unsub = null; ctl = null; view = null; work = null; workKey = ''; lastSeat = null; slots = null; slotsFor = ''; anchor = null; press = null;
    store.del('rk_sess');
    $('#cover').classList.add('hidden');
    closeModal();
    showScreen('home');
    if (msg) toast(msg);
  }

  function onView(v) {
    if (v.status === 'loading') return; // 방 데이터를 처음 받아오는 중
    view = v;
    if (v.status === 'gone') { goHome('방이 없어졌어요'); return; }
    if (v.status === 'lobby') { work = null; workKey = ''; showScreen('lobby'); renderLobby(); }
    else if (v.status === 'playing') { showScreen('game'); syncWork(); renderGame(); }
    else if (v.status === 'over') { work = null; workKey = ''; showScreen('result'); renderResult(); }
    if (v.code && v.mySeat != null && !v.local) store.set('rk_sess', J({ code: v.code, seat: v.mySeat }));
  }

  /* ================= 받침대(2줄 칸) ================= */
  // slots = {cols, cells:[2*cols]} : cells[r*cols+c] = 타일 id 또는 null. 내 기기에만 저장.
  let slots = null;
  let slotsFor = '';
  const localSlots = {};
  let fresh = new Map();
  let anchor = null;   // 더블클릭 대상 세트를 가리키는 타일 id
  let press = null;    // 누르고 있는 중인 타일/세트
  let lastTap = null;
  const needCols = (n) => Math.max(10, Math.ceil((n + 3) / 2));
  const slotKey = () => (view.local ? 'local-' + view.mySeat : 'rk_rack_' + view.code + '_' + view.mySeat);
  function layoutSorted(list) {
    const cols = needCols(list.length);
    const cells = new Array(cols * 2).fill(null);
    list.forEach((id, i) => { cells[i] = id; });
    return { cols, cells };
  }
  function setCols(n) {
    const old = slots, cells = new Array(n * 2).fill(null);
    for (let r = 0; r < 2; r++) for (let c = 0; c < Math.min(n, old.cols); c++) cells[r * n + c] = old.cells[r * old.cols + c];
    slots = { cols: n, cells };
  }
  function saveSlots() {
    if (!slots || !view) return;
    if (view.local) localSlots[slotKey()] = JSON.parse(J(slots));
    else store.set(slotKey(), J(slots));
  }
  function loadSlots() {
    let s = null;
    if (view.local) s = localSlots[slotKey()] || null;
    else { try { s = JSON.parse(store.get(slotKey()) || 'null'); } catch (e) { s = null; } }
    if (!s || !Array.isArray(s.cells) || s.cells.length !== s.cols * 2) return null;
    const hs = new Set(work.hand);
    const keep = s.cells.filter((id) => id != null && hs.has(id)).length;
    return keep * 2 >= work.hand.length ? s : null; // 패가 많이 달라졌으면(새 게임) 새로 정렬
  }
  /** work.hand 와 칸 배치를 맞춘다. markFresh: 새로 들어온 타일을 반짝이게 */
  function reconcile(markFresh) {
    const hs = new Set(work.hand);
    if (!slots) slots = layoutSorted(RK.sortHand(work.hand, 'color'));
    const seen = new Set();
    slots.cells = slots.cells.map((id) => (id != null && hs.has(id) && !seen.has(id) && seen.add(id) ? id : null));
    const need = needCols(work.hand.length);
    if (slots.cols < need) setCols(need);
    const now = Date.now();
    for (const id of work.hand) {
      if (seen.has(id)) continue;
      let k = slots.cells.indexOf(null);
      if (k < 0) { setCols(slots.cols + 2); k = slots.cells.indexOf(null); }
      slots.cells[k] = id;
      if (markFresh) fresh.set(id, now + 1600);
    }
    while (slots.cols > need && slots.cells[slots.cols - 1] == null && slots.cells[slots.cols * 2 - 1] == null) setCols(slots.cols - 1);
    work.hand = slots.cells.filter((id) => id != null);
    saveSlots();
    if (markFresh && fresh.size) setTimeout(() => { if (work) renderRack(); }, 1700);
  }

  function syncWork() {
    const g = view.game;
    if (!g || view.mySeat == null) return;
    if (view.mySeat !== lastSeat) { work = null; lastSeat = view.mySeat; }
    const key = g.seq + '|' + J(view.myHand) + '|' + view.mySeat;
    if (key !== workKey || !work) {
      workKey = key;
      const had = !!work && slotsFor === slotKey();
      work = { table: clone(g.table), hand: view.myHand.slice() };
      if (!had) { slots = loadSlots(); slotsFor = slotKey(); }
      reconcile(had);
      anchor = null;
      hintIds = new Set();
      showMsg('');
    }
    // 내 차례 알림
    if (view.mySeat === g.turn && g.seq !== lastNotify && !view.local && g.winner === -1) {
      lastNotify = g.seq;
      toast('내 차례예요!', 1800);
      sfx.turn();
      try { navigator.vibrate && navigator.vibrate(150); } catch (e) {}
    }
  }

  /* ================= 대기실 ================= */
  let lbKey = '';
  function renderLobby() {
    const v = view;
    $('#lb-code').textContent = v.code;
    $('#lb-name').textContent = [v.roomName, v.hasPw ? '비밀번호 방' : ''].filter(Boolean).join(' · ');
    const empty = v.seats.filter((s) => !s).length;
    $('#lb-seats').innerHTML = v.seats.map((s, i) => s

      : `<div class="seat empty"><span class="av">${i + 1}</span><span class="nm">기다리는 중…</span>${v.isHost ? `<button data-bot="${i}" style="padding:4px 10px">🤖 컴퓨터 넣기</button>` : ''}</div>`).join('')
      + (v.isHost && empty > 1 ? '<button data-fill="1" class="ghost" style="margin-top:4px">🤖 빈자리 모두 컴퓨터로</button>' : '');
    $('#lb-summary').innerHTML = summaryHTML(v.settings);
    $('#lb-hostbox').classList.toggle('hidden', !v.isHost);
    const k = J(v.settings);
    if (k !== lbKey) { lbKey = k; $('#lb-settings').innerHTML = settingsHTML('lb', false, v.settings); }
    const full = v.seats.every(Boolean);
    $('#lb-start').classList.toggle('hidden', !v.isHost);
    $('#lb-start').disabled = !full;
    $('#lb-wait').textContent = v.isHost ? (full ? '모두 모였어요! 시작하세요.' : '친구들이 방 코드를 입력하면 자리가 채워져요. 사람이 모자라면 컴퓨터를 넣을 수 있어요.') : '방장이 시작하기를 기다리는 중이에요…';
  }
  $('#lb-seats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-kick]');
    if (b) ctl.kick(Number(b.dataset.kick)).catch((er) => toast(er.message));
    const bb = e.target.closest('[data-bot]');
    if (bb) ctl.addBot(Number(bb.dataset.bot)).catch((er) => toast(er.message));
    if (e.target.closest('[data-fill]')) ctl.fillBots().catch((er) => toast(er.message));
  });
  $('#lb-save').onclick = async () => {
    try { await ctl.updateSettings(readSettings('lb')); toast('설정을 바꿨어요'); } catch (e) { toast(e.message); }
  };
  $('#lb-start').onclick = async () => { try { await ctl.startGame(); } catch (e) { toast(e.message); } };
  $('#lb-leave').onclick = async () => { await ctl.leave(); goHome(); };
  $('#lb-copy').onclick = async () => {
    const url = location.origin + location.pathname + '?room=' + view.code;
    try { await navigator.clipboard.writeText(url); toast('초대 링크를 복사했어요'); } catch (e) { toast(url, 6000); }
  };

  /* ================= 게임 화면 ================= */
  function tileHTML(id, cls) {
    if (RK.isJoker(id)) return `<div class="tile joker ${cls || ''}" data-id="${id}"><span class="n">★</span><small>조커</small></div>`;
    const c = RK.colorOf(id);
    return `<div class="tile c${c} ${cls || ''}" data-id="${id}"><span class="n">${RK.numOf(id)}</span><small>${SYM[c]}</small></div>`;
  }
  const myTurn = () => !!(view && view.game && view.status === 'playing' && view.mySeat === view.game.turn && !view.cover);
  const isDirty = () => !!(work && view.game && (J(work.table) !== J(view.game.table) || work.hand.length !== view.myHand.length));
  function showMsg(t, kind) {
    const m = $('#msg');
    m.textContent = t || '';
    m.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function renderGame() {
    const v = view, g = v.game;
    if (!g || !work) return;
    // 가림막 (한 화면 연습)
    const cv = $('#cover');
    if (v.cover) {
      const ck = v.coverBot ? 'bot' + g.turn : 'h' + v.mySeat + '-' + g.seq;
      if (cv.dataset.k !== ck) {
        cv.dataset.k = ck;
        cv.innerHTML = v.coverBot
          ? `<div class="box">${avHTML(v.seats[g.turn], g.turn)}<h2>🤖 ${esc(v.seats[g.turn].name)} 생각 중…</h2><p class="hint">컴퓨터 차례예요. 잠깐 기다려 주세요.</p></div>`
          : `<div class="box"><div style="display:flex;justify-content:center;margin-bottom:8px;transform:scale(1.6)">${avHTML(v.seats[v.mySeat], v.mySeat)}</div><h2>${esc(v.seats[v.mySeat].name)} 차례</h2><p class="hint">다른 사람은 화면을 보지 마세요.<br>준비되면 아래 버튼을 눌러요.</p><button class="primary" id="cv-go">내 패 보기 👀</button></div>`;
      }
      cv.classList.remove('hidden');
    } else cv.classList.add('hidden');

    const mine = myTurn();
    $('#g-code').textContent = v.local ? '🎮 연습' : '🏠 ' + v.code;
    $('#g-pool').textContent = '🎴 더미 ' + g.poolLeft;
    $('#reacts').classList.toggle('hidden', !!v.local || !v.settings.reactions);
    const cur = v.seats[g.turn];
    $('#g-turn').textContent = mine ? '내 차례예요!' : cur && (cur.bot || cur.ai) ? '🤖 ' + cur.name + ' 생각 중…' : (cur ? cur.name : '') + ' 님의 차례';
    $('#g-turn').className = 'turn' + (mine ? ' mine' : '');
    $('#opps').innerHTML = v.seats.map((s, i) =>
      `<div class="opp ${i === g.turn ? 'cur' : ''} ${s && !s.online ? 'off' : ''}" data-seat="${i}">${avHTML(s, i)}<div class="info"><b>${esc(shortName(s))}${i === v.mySeat && s && s.name !== '나' && !(v.local && v.seats.filter((x) => !x.bot).length > 1) ? ' (나)' : ''}</b><span class="meta"><span class="cnt">${g.counts[i]}</span><span class="badge ${g.melded[i] ? '' : 'no'}">${g.melded[i] ? '등록 ✔' : '등록 전'}</span>${s && !s.online && !s.ai ? '<span>끊김</span>' : ''}</span></div>${i === g.turn ? '<span class="bar"><i></i></span>' : ''}</div>`).join('');
    $('#opps').classList.toggle('hidden', v.seats.length < 2);
    renderBoard(); renderRack(); renderControls(); updateTimers();
    showFirstDraw(); showReact();
  }

  /* ================= 선 정하기 연출 ================= */
  let fdShown = '';
  let fdHold = false;
  function showFirstDraw() {
    const g = view.game;
    if (!g || !g.firstDraw || g.seq !== 1 || fdShown === g.gameId || view.seats.length < 2 || window.__SKIP_FD__) return;
    fdShown = g.gameId;
    fdHold = true;
    const first = g.turn;
    const el = $('#firstdraw');
    el.innerHTML = `<div class="box"><h2>🎲 누가 먼저 할까?</h2><p class="hint">한 장씩 뽑아서 숫자가 가장 큰 사람이 먼저 해요 (같으면 다시 뽑기)</p>
      <div class="fd-row">${g.firstDraw.map((tiles, i) => `<div class="fd ${i === first ? 'win' : ''}" style="animation-delay:${i * 0.15}s">${avHTML(view.seats[i], i)}<b>${esc(shortName(view.seats[i]))}</b><div class="tiles">${tiles.map((id) => tileHTML(id)).join('')}</div>${i === first ? '<span class="tag">먼저 시작!</span>' : ''}</div>`).join('')}</div>
      <button class="primary" id="fd-go">시작하기 ▶</button></div>`;
    el.classList.remove('hidden');
    const close = () => { el.classList.add('hidden'); fdHold = false; };
    el.querySelector('#fd-go').onclick = close;
    setTimeout(close, 4500);
  }

  const lockedIds = () => new Set(view.game.table.reduce((a, s) => a.concat(s), []));
  /** 더블클릭으로 넣을 수 있는 세트인가: 첫 등록 전에는 이번 차례에 새로 만든 세트만 */
  function allowedSet(i, locked) {
    if (!work.table[i]) return false;
    if (view.game.melded[view.mySeat]) return true;
    return !work.table[i].some((id) => locked.has(id));
  }
  /** 더블클릭 대상 세트 번호(-1이면 새 세트) */
  function targetIndex() {
    const locked = lockedIds();
    const i = anchor == null ? -1 : work.table.findIndex((s) => s.includes(anchor));
    if (i >= 0 && allowedSet(i, locked)) return i;
    for (let k = work.table.length - 1; k >= 0; k--) {
      if (!work.table[k].some((id) => locked.has(id))) return k; // 이번 차례에 만든 가장 최근 세트
    }
    return -1;
  }

  function renderBoard() {
    const g = view.game, mine = myTurn(), dirty = isDirty();
    const recent = new Set(!dirty ? g.lastPlaced : []);
    const ti = mine ? targetIndex() : -1;
    let h = work.table.map((s, i) => {
      const r = RK.validateSet(s);
      const cls = (r.valid ? 'ok' : (s.length < 3 ? 'wip' : 'bad')) + (i === ti ? ' target' : '');
      const note = !r.valid && mine ? `<span class="why">${esc(r.reason)}</span>` : '';
      const grip = mine ? '<span class="grip" title="끌어서 세트 순서 바꾸기">⠿</span>' : '';
      const tgt = i === ti ? '<span class="tgt">▶ 여기에 들어가요</span>' : '';
      return `<div class="set ${cls}" data-i="${i}">${grip}${s.map((id) => tileHTML(id, recent.has(id) ? 'recent' : '')).join('')}${r.valid ? `<span class="pts">${r.points}</span>` : ''}${tgt}${note}</div>`;
    }).join('');
    if (!work.table.length) h += `<div class="empty">아직 테이블이 비어 있어요.${mine ? '<br>패의 타일을 <b>두 번 누르거나</b> 이곳으로 끌어다 놓아 세트를 만드세요.' : ''}</div>`;
    else if (mine) h += '<div class="newhint">▼ 빈 곳에 끌어다 놓으면 새 세트 · 타일을 두 번 누르면 ▶ 표시된 세트로 들어가요</div>';
    $('#board').innerHTML = h;
    $('#board').classList.toggle('newok', mine);
  }
  function renderRack() {
    if (!slots) return;
    const now = Date.now();
    for (const [id, t] of fresh) if (t < now) fresh.delete(id);
    const rack = $('#rack');
    rack.style.setProperty('--cols', slots.cols);
    rack.innerHTML = slots.cells.map((id, i) => `<div class="slot" data-s="${i}">${id != null ? tileHTML(id, (fresh.has(id) ? 'fresh ' : '') + (hintIds.has(id) ? 'hinted' : '')) : ''}</div>`).join('');
  }
  function renderControls() {
    const g = view.game, mine = myTurn(), dirty = isDirty();
    $('#b-end').disabled = !(mine && dirty && !acting);
    $('#b-undo').disabled = !(mine && dirty && !acting);
    $('#b-draw').disabled = !(mine && !dirty && !acting);
    $('#b-draw').textContent = g.poolLeft > 0 ? '🎴 뽑고 넘기기' : '넘기기 (더미 없음)';
    const hl = hintsLeft();
    $('#b-hint').classList.toggle('hidden', !view.settings.hints);
    $('#hint-cnt').textContent = view.settings.hints === 99 ? '∞' : hl;
    $('#b-hint').disabled = !(mine && !acting && (hl > 0 || view.settings.hints === 99));
    const off = view.seats[g.turn] && !view.seats[g.turn].online;
    $('#b-force').classList.toggle('hidden', !(view.isHost && !view.local && !mine && off && !view.seats[g.turn].ai));
    $('#b-ai').classList.toggle('hidden', !(view.isHost && !view.local && view.seats.some((s) => s && !s.bot && !s.online && !s.ai)));
    if (!$('#msg').classList.contains('err') && !$('#msg').classList.contains('good')) {
      let t = '';
      if (mine) {
        if (!g.melded[view.mySeat]) {
          const m = RK.meldPointsOf(g.table, work.table);
          t = `첫 등록: 지금 ${m.points}점 / ${view.settings.minMeld}점` + (m.touched ? ' — 첫 등록 전에는 테이블의 세트를 건드릴 수 없어요' : '');
        } else t = dirty ? '다 정리했으면 [차례 종료]를 누르세요' : '타일을 내거나, 낼 수 없으면 [뽑고 넘기기]';
      } else t = '다른 사람의 차례예요. 그동안 내 패를 정리해 두세요';
      $('#msg').textContent = t;
    }
  }
  function updateTimers() {
    if (!view || view.status !== 'playing' || !view.game || !ctl) return;
    const g = view.game, st = view.settings, t = ctl.now();
    const tt = $('#g-tt');
    const cs = view.seats[g.turn];
    let hurry = false;
    const bar = document.querySelector('.opp.cur .bar i');
    if (st.turnSec > 0 && !view.cover && !(cs && (cs.bot || cs.ai))) {
      const left = Math.max(0, Math.ceil((g.turnStartedAt + st.turnSec * 1000 - t) / 1000));
      tt.textContent = '⏱ ' + left + '초';
      tt.className = 'chip tm' + (left <= 10 ? ' warn' : '');
      if (bar) bar.style.width = Math.max(0, Math.min(100, (left / st.turnSec) * 100)) + '%';
      hurry = myTurn() && left <= 10;
      if (myTurn() && left <= 5 && left > 0) sfx.tick();
    } else { tt.textContent = ''; tt.className = 'chip tm hidden'; if (bar) bar.style.width = '100%'; }
    $('#board').classList.toggle('hurry', hurry);
    $('#g-total').textContent = g.endsAt ? '⌛ 전체 ' + mmss(Math.max(0, Math.ceil((g.endsAt - t) / 1000))) : '';
    $('#g-total').classList.toggle('hidden', !g.endsAt);
  }
  setInterval(() => { updateTimers(); if (ctl && ctl.tick) ctl.tick(); }, 1000);

  $('#cover').addEventListener('click', (e) => { if (e.target.id === 'cv-go') ctl.reveal(); });

  /* ================= 힌트 ================= */
  const hintMem = {};
  const hintKey = () => 'rk_hint_' + (view.game.gameId || '') + '_' + view.mySeat;
  function hintsUsed() { const k = hintKey(); return Number(view.local ? hintMem[k] || 0 : store.get(k) || 0); }
  function hintsLeft() { const st = view.settings; if (!st.hints) return 0; return Math.max(0, st.hints - hintsUsed()); }
  function useHint() { const k = hintKey(); const n = hintsUsed() + 1; if (view.local) hintMem[k] = n; else store.set(k, String(n)); }
  function showHint() {
    if (!myTurn() || !window.RKAI) return;
    if (view.settings.hints !== 99 && hintsLeft() <= 0) return;
    const g = view.game;
    const mv = RKAI.chooseMove({ table: g.table, hand: view.myHand, melded: g.melded[view.mySeat], minMeld: view.settings.minMeld, level: 3, rng: () => 0.99 });
    if (!mv) { showMsg('💡 지금은 낼 수 있는 타일이 없어 보여요. [뽑고 넘기기]를 누르세요', 'good'); return; }
    useHint();
    const left = new Set(mv.hand);
    const play = view.myHand.filter((id) => !left.has(id));

  /* ================= 누르기·두 번 누르기·드래그 ================= */
  function beforeIdIn(container, x, y) {
    const tiles = container.querySelectorAll('.tile:not(.dragging)');
    for (const t of tiles) {
      const r = t.getBoundingClientRect();
      if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) return Number(t.dataset.id);
    }
    return null;
  }
  function findDest(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    if (el.closest('#rack')) {
      const s = el.closest('.slot');
      return { type: 'slot', slot: s ? Number(s.dataset.s) : -1, el: s || $('#rack') };
    }
    if (!myTurn()) return null;
    const s = el.closest('.set');
    if (s) return { type: 'set', setIndex: Number(s.dataset.i), beforeId: beforeIdIn(s, x, y), el: s };
    if (el.closest('#board')) return { type: 'new', el: $('#board') };
    return null;
  }
  /** 세트를 끌 때: 어느 세트 앞에 넣을지 */
  function findSetDest(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el || !el.closest('#board')) return null;
    const s = el.closest('.set');
    if (!s) return { before: work.table.length, el: $('#board') };
    const r = s.getBoundingClientRect();
    const i = Number(s.dataset.i);
    return { before: x < r.left + r.width / 2 ? i : i + 1, el: s };
  }
  function clearHover() { document.querySelectorAll('.drop-hover').forEach((e) => e.classList.remove('drop-hover')); }
  function refresh() { showMsg(''); for (const id of hintIds) if (!work.hand.includes(id)) hintIds.delete(id); sfx.place(); renderBoard(); renderRack(); renderControls(); }

  /** 패 타일 두 번 누르기: ▶ 세트(없으면 새 세트)로 넣고 자동 정렬 */
  function quickPlace(id) {
    if (!myTurn()) { showMsg('내 차례에만 낼 수 있어요', 'err'); return; }
    const locked = lockedIds();
    const ti = targetIndex();
    const n = RK.moveTile(work, id, ti < 0 ? { type: 'new' } : { type: 'set', setIndex: ti }, locked);
    if (!n) return;
    const si = n.table.findIndex((s) => s.includes(id));
    n.table[si] = RK.arrangeSet(n.table[si]);
    work = n; anchor = id;
    reconcile(false); refresh();
  }
  /** 테이블 타일 두 번 누르기: 이번 차례에 낸 타일이면 패로 되돌림 */
  function quickReturn(id) {
    const locked = lockedIds();
    if (locked.has(id)) { showMsg('테이블에 원래 있던 타일은 패로 가져올 수 없어요', 'err'); return; }
    const n = RK.moveTile(work, id, { type: 'hand' }, locked);
    if (!n) return;
    work = n; reconcile(false); refresh();
  }
  function setTarget(i) {
    if (!myTurn() || !work.table[i]) return;
    if (!allowedSet(i, lockedIds())) { showMsg('첫 등록 전에는 테이블에 원래 있던 세트에 넣을 수 없어요', 'err'); return; }
    anchor = work.table[i][0];
    renderBoard();
  }

  function onDown(e) {
    if (!work || acting || press || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (view.cover) return;
    const grip = e.target.closest('.grip');
    const t = e.target.closest('.tile');
    const setEl = e.target.closest('.set');
    let kind;
    if (grip && setEl) { if (!myTurn()) return; kind = 'set'; }
    else if (t) {
      if (t.classList.contains('mini')) return;
      if (t.closest('#board') && !myTurn()) return;
      kind = 'tile';
    } else if (setEl) { if (!myTurn()) return; kind = 'settap'; }
    else return;
    if (kind !== 'settap') e.preventDefault();
    const el = kind === 'tile' ? t : setEl;
    press = {
      kind, el, x: e.clientX, y: e.clientY, started: false,
      id: t ? Number(t.dataset.id) : null,
      inBoard: !!(t && t.closest('#board')),
      si: setEl ? Number(setEl.dataset.i) : null,
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }
  function startDrag(e) {
    const r = press.el.getBoundingClientRect();
    const ghost = press.el.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.classList.remove('target');
    ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
    document.body.appendChild(ghost);
    press.ghost = ghost; press.dx = press.x - r.left; press.dy = press.y - r.top;
    press.el.classList.add('dragging');
    press.started = true;
    moveGhost(e.clientX, e.clientY);
  }
  function moveGhost(x, y) {
    press.ghost.style.left = x - press.dx + 'px';
    press.ghost.style.top = y - press.dy + 'px';
  }
  function onMove(e) {
    if (!press) return;
    if (!press.started) {
      if (press.kind === 'settap') return;
      if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6) return;
      startDrag(e);
    }
    moveGhost(e.clientX, e.clientY);
    clearHover();
    const d = press.kind === 'set' ? findSetDest(e.clientX, e.clientY) : findDest(e.clientX, e.clientY);
    if (d && d.el) d.el.classList.add('drop-hover');
    const br = $('#board').getBoundingClientRect();
    if (e.clientY > br.top && e.clientY < br.top + 36) $('#board').scrollTop -= 14;
    else if (e.clientY < br.bottom && e.clientY > br.bottom - 36) $('#board').scrollTop += 14;
  }
  function endPress() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    if (press && press.ghost) { press.ghost.remove(); press.el.classList.remove('dragging'); }
    clearHover();
    const p = press; press = null;
    return p;
  }
  function onCancel() { endPress(); }
  function onTap(p) {
    if (p.kind === 'set' || p.kind === 'settap') { setTarget(p.si); return; }
    const now = Date.now();
    if (lastTap && lastTap.id === p.id && now - lastTap.t < 450) {
      lastTap = null;
      if (p.inBoard) quickReturn(p.id); else quickPlace(p.id);
      return;
    }
    lastTap = { id: p.id, t: now };
    if (p.inBoard && myTurn()) {
      const i = work.table.findIndex((s) => s.includes(p.id));
      if (i >= 0 && allowedSet(i, lockedIds())) { anchor = p.id; renderBoard(); }
    }
  }
  function onUp(e) {
    if (!press) return;
    const p = endPress();
    if (!p.started) { onTap(p); return; }
    if (p.kind === 'set') {
      const d = findSetDest(e.clientX, e.clientY);
      if (!d) return;
      const moved = work.table[p.si];
      work = { table: RK.moveSet(work.table, p.si, d.before), hand: work.hand };
      anchor = moved[0];
      refresh();
      return;
    }
    dropTile(p.id, findDest(e.clientX, e.clientY));
  }
  function dropTile(id, d) {
    if (!d) return;
    const locked = lockedIds();
    if (d.type === 'slot') {
      const inHand = work.hand.includes(id);
      if (!inHand) {
        if (locked.has(id)) { showMsg('테이블에 원래 있던 타일은 패로 가져올 수 없어요', 'err'); return; }
        const n = RK.moveTile(work, id, { type: 'hand' }, locked);
        if (!n) return;
        work = n;
      }
      const cells = slots.cells;
      const from = cells.indexOf(id);
      if (d.slot >= 0 && d.slot !== from) {
        const occ = cells[d.slot];
        if (from >= 0) cells[from] = occ;          // 패 안에서 옮기기: 자리 바꾸기
        else if (occ != null) cells[cells.indexOf(null)] = occ; // 테이블에서 가져오기: 있던 타일은 빈칸으로
        cells[d.slot] = id;
      }
      reconcile(false); refresh();
      return;
    }
    const n = RK.moveTile(work, id, { type: d.type, setIndex: d.setIndex, beforeId: d.beforeId }, locked);
    if (!n) return;
    work = n; anchor = id;
    reconcile(false); refresh();
  }
  $('#board').addEventListener('pointerdown', onDown);
  $('#rack').addEventListener('pointerdown', onDown);

  let celebrated = '';
  function confetti() {
    const box = document.createElement('div');
    box.className = 'confetti';

  /** 누적 점수표: 이름 기준으로 판 수·승리·총점, 공식 '라운드' = 인원수만큼의 판 */
  function scoreboardHTML(v) {
    const h = v.history || [];
    if (!h.length) return '';
    const map = new Map();
    h.forEach((e) => e.n.forEach((nm, i) => {
      const key = (e.b && e.b[i] ? '🤖 ' : '') + nm;
      const r = map.get(key) || { name: key, games: 0, wins: 0, total: 0 };
      r.games++; r.total += e.s[i]; if (e.w === i) r.wins++;
      map.set(key, r);
    }));
    const rows = [...map.values()].sort((a, b) => b.wins - a.wins || b.total - a.total);
    const per = v.settings.players;
    const n = h.length;
    const roundNo = Math.ceil(n / per);
    const inRound = n - (roundNo - 1) * per;
    let round = `<p class="hint">공식 규칙에서는 <b>인원수(${per}판)</b>를 한 라운드로 보고, 이긴 판이 가장 많은 사람이 라운드 우승이에요(같으면 총점). 지금 <b>${roundNo}라운드 ${inRound}/${per}판</b>.</p>`;
    if (inRound === per) {
      const last = h.slice(n - per);
      const m2 = new Map();
      last.forEach((e) => e.n.forEach((nm, i) => {
        const key = (e.b && e.b[i] ? '🤖 ' : '') + nm;
        const r = m2.get(key) || { name: key, wins: 0, total: 0 };
        r.total += e.s[i]; if (e.w === i) r.wins++; m2.set(key, r);
      }));
      const best = [...m2.values()].sort((a, b) => b.wins - a.wins || b.total - a.total)[0];
      round = `<div class="round-win">🏆 ${roundNo}라운드 우승: ${esc(best.name)} (${best.wins}승, ${best.total > 0 ? '+' : ''}${best.total}점)</div>` + round;
    }
    return `<h3>📊 누적 점수표 (${n}판)</h3>${round}
      <table class="board-score"><tr><th>이름</th><th style="text-align:right">판</th><th style="text-align:right">승리</th><th style="text-align:right">총점</th></tr>
      ${rows.map((r, i) => `<tr class="${i === 0 ? 'lead' : ''}"><td>${i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : ''}${esc(r.name)}</td><td class="num">${r.games}</td><td class="num">${r.wins}</td><td class="num">${r.total > 0 ? '+' : ''}${r.total}</td></tr>`).join('')}</table>
      ${v.isHost ? '<button class="ghost" id="rs-reset" style="margin-top:10px">점수표 초기화</button>' : ''}`;
  }
  function renderResult() {
    const v = view, g = v.game;

      if (iWon) { confetti(); sfx.win(); }
    }
  }

  /* ================= Firebase 준비 ================= */
  async function initFirebase() {
    if (window.__FB_TEST__) return window.__FB_TEST__;
    const cfg = window.FIREBASE_CONFIG || {};
    if (!cfg.apiKey || !cfg.databaseURL) return null;
    const V = '10.12.2';
    const [A, D] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/' + V + '/firebase-database.js'),
    ]);
    const app = A.initializeApp(cfg);
    const db = D.getDatabase(app);
    const R = (p) => (p ? D.ref(db, p) : D.ref(db));
    return {
      get: async (p) => (await D.get(R(p))).val(),
      set: (p, v) => D.set(R(p), v),
      update: (p, o) => D.update(R(p), o),
      onValue: (p, cb) => D.onValue(R(p), (s) => cb(s.val())),
      transaction: async (p, fn) => { const r = await D.runTransaction(R(p), fn); return { committed: r.committed }; },
      onDisconnectSet: (p, v) => D.onDisconnect(R(p)).set(v),
    };
  }
  (async function boot() {
    const st = $('#net-status');
    const q = new URLSearchParams(location.search).get('room');
    if (q) { selectTab('join'); $('#in-code').value = q.replace(/\D/g, '').slice(0, 4); }
    if (!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey) && !window.__FB_TEST__) {
      st.textContent = '온라인 설정(Firebase)이 아직 없어요. "한 화면 연습"만 할 수 있어요.';
      if (!q) selectTab('local');
      return;
    }
    st.textContent = '온라인 연결 준비 중…';
    try {
      const fb = await initFirebase();
      netObj = NET.createNet(fb, RK, { cid, AI: window.RKAI, getWork: () => (work && view && view.game ? { dirty: isDirty(), table: work.table, hand: work.hand } : null) });
      netReady = true;
      st.textContent = '온라인 연결 준비 완료 ✔';
      const sess = store.get('rk_sess');
      if (sess) {
        try { await netObj.resume(JSON.parse(sess)); attach(netObj); toast('이전 방에 다시 연결했어요'); }
        catch (e) { store.del('rk_sess'); }
      }
    } catch (e) {
      st.textContent = '온라인 연결에 실패했어요: ' + e.message;
    }
  })();

  window.__app = { get ctl() { return ctl; }, get work() { return work; }, get view() { return view; } };
})();
</script>
</body>
</html>
