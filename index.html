<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>루미큐브 온라인</title>
<style>
:root{
  --bg:#14301f; --panel:#1c4630; --felt:#2a6a4c; --felt-d:#235a40; --wood:#8a5a32; --wood-l:#a8743f;
  --ink:#f3f1e7; --muted:#b9d0c1; --accent:#ffcf4a; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#ffb454;
  --c0:#d62f2f; --c1:#1f6fe0; --c2:#d98e00; --c3:#222;
  --tw:34px;
}
@media (min-width:700px){:root{--tw:40px}}
@media (min-width:1100px){:root{--tw:46px}}
@media (max-width:420px){:root{--tw:30px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overscroll-behavior:none}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#e9e3cf;color:#26301f;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.25)}
button:hover:not(:disabled){filter:brightness(1.06)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent)}
button.danger{background:#f3b0b0}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.35)}
input,select{background:#fff;color:#222;border:2px solid #cfc7a8;border-radius:8px;padding:8px 10px;width:100%}
.hidden{display:none!important}
.screen{height:100%;height:100dvh}
.card{max-width:560px;margin:0 auto;padding:18px;height:100%;overflow:auto}
h1{margin:6px 0 2px;font-size:28px}
h3{margin:0 0 8px}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.f{display:block;margin:8px 0;font-weight:700;font-size:14px}
.f select,.f input{margin-top:4px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.tabs{display:flex;gap:6px;margin:12px 0 8px}
.tabs button{flex:1;background:rgba(255,255,255,.12);color:var(--ink);box-shadow:none}
.tabs button.on{background:var(--accent);color:#2a2400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.logo{display:flex;gap:6px;margin:4px 0 10px}
.panel{background:var(--panel);border-radius:14px;padding:12px;margin:10px 0}

/* 타일 */
.tile{width:var(--tw);height:calc(var(--tw)*1.38);border-radius:7px;background:#fbf7ea;border:1px solid #b6aa88;box-shadow:0 2px 0 #c9bb96;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;flex:0 0 auto;line-height:1}
.tile .n{font-weight:900;font-size:calc(var(--tw)*.58)}
.tile small{font-size:calc(var(--tw)*.3);margin-top:2px}
.tile.c0{color:var(--c0)}.tile.c1{color:var(--c1)}.tile.c2{color:var(--c2)}.tile.c3{color:var(--c3)}
.tile.joker{color:#8b3fd1}
.tile.dragging{opacity:.25}
.tile.recent{outline:3px solid var(--accent);outline-offset:1px}
.tile.mini{width:22px;height:30px;border-radius:4px;cursor:default}
.tile.mini .n{font-size:13px}.tile.mini small{font-size:8px;margin-top:0}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:scale(1.18) rotate(-4deg);opacity:.95;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}

/* 게임 화면 */
#s-game{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.top .turn{font-weight:800;font-size:16px}
.top .turn.mine{color:var(--accent)}
.top .sp{flex:1}
.tm.warn{color:var(--bad);font-weight:900}
.opps{display:flex;gap:6px;padding:6px 8px;overflow-x:auto}
.opp{flex:1;min-width:84px;background:var(--panel);border-radius:10px;padding:5px 8px;font-size:12px;display:flex;flex-direction:column;border:2px solid transparent}
.opp b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp.cur{border-color:var(--accent);background:#24593f}
.opp.off{opacity:.5}
.opp i{font-style:normal;color:var(--muted)}
.board{flex:1;min-height:80px;background:var(--felt);margin:0 8px;border-radius:14px;padding:10px;overflow:auto;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;box-shadow:inset 0 0 0 3px var(--felt-d)}
.board .empty{color:rgba(255,255,255,.55);align-self:center;margin:auto;text-align:center}
.set{display:flex;flex-wrap:wrap;gap:3px;padding:8px;border-radius:12px;border:2px dashed transparent;background:rgba(0,0,0,.12);align-items:center;position:relative;max-width:100%}
.set.ok{border-color:var(--ok);border-style:solid}
.set.bad{border-color:var(--bad);border-style:solid;background:rgba(255,80,80,.14)}
.set.wip{border-color:var(--warn)}
.set .pts{position:absolute;right:6px;top:-9px;background:var(--ok);color:#06331f;font-size:11px;font-weight:800;border-radius:9px;padding:0 6px}
.set .why{flex-basis:100%;font-size:11px;color:#ffd9d9}
.set.wip .why{color:#ffe2b8}
.drop-hover{outline:3px dashed var(--accent);outline-offset:2px}
.board.newok .newhint{display:block}
.newhint{display:none;flex-basis:100%;text-align:center;color:rgba(255,255,255,.6);font-size:12px;padding:6px}
.bottom{padding:6px 8px 8px}
.msg{min-height:20px;font-size:13px;margin:2px 2px 4px}
.msg.err{color:#ffd0d0;font-weight:700}
.msg.good{color:var(--ok)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.ctl button{padding:8px 11px;font-size:13px}
.rack{background:linear-gradient(var(--wood-l),var(--wood));border-radius:12px;padding:8px;min-height:calc(var(--tw)*1.38 + 16px);max-height:34vh;overflow:auto;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}

/* 모달·토스트·가림막 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:900;padding:14px}
#modal .box{background:#fff;color:#222;border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:86vh;overflow:auto}
#modal .box button{display:block;width:100%;margin:6px 0}
#modal ul{padding-left:18px;margin:6px 0;line-height:1.55;font-size:14px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:12px;z-index:1200;font-weight:700;max-width:92vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#cover{position:fixed;inset:0;background:var(--bg);z-index:800;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#cover .box{max-width:420px}
#cover h2{font-size:26px;margin:0 0 8px}

/* 대기실·결과 */
.seat{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:8px 10px;margin:5px 0}
.seat .dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.seat.off .dot{background:#888}
.seat.empty{opacity:.5;border:2px dashed rgba(255,255,255,.3);background:transparent}
.seat .nm{flex:1;font-weight:700}
.big{font-size:44px;font-weight:900;letter-spacing:6px;color:var(--accent)}
.sum{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.sum span:nth-child(odd){color:var(--muted)}
.rank{background:var(--panel);border-radius:12px;padding:10px;margin:8px 0}
.rank.win{border:2px solid var(--accent)}
.rank .hd{display:flex;gap:8px;align-items:baseline}
.rank .hd b{font-size:17px}
.rank .sc{margin-left:auto;font-weight:900}
.rank .sc.pos{color:var(--ok)}.rank .sc.neg{color:var(--bad)}
.rank .tiles{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
</style>
</head>
<body>
<noscript>이 게임은 자바스크립트가 필요해요.</noscript>

<!-- 홈 -->
<section id="s-home" class="screen">
  <div class="card">
    <div class="logo">
      <div class="tile c0"><span class="n">1</span><small>●</small></div>
      <div class="tile c1"><span class="n">2</span><small>▲</small></div>
      <div class="tile c2"><span class="n">3</span><small>■</small></div>
      <div class="tile c3"><span class="n">4</span><small>◆</small></div>
    </div>
    <h1>루미큐브 온라인</h1>
    <p class="hint">친구들과 함께하는 숫자 타일 게임</p>
    <label class="f">내 이름
      <input id="in-name" maxlength="8" placeholder="이름 (8자 이내)" autocomplete="off">
    </label>
    <div class="tabs">
      <button data-tab="create" class="on">방 만들기</button>
      <button data-tab="join">방 입장</button>
      <button data-tab="local">한 화면 연습</button>
    </div>

    <div id="tab-create" class="panel">
      <div class="grid2">
        <label class="f">방 이름 (선택)<input id="in-roomname" maxlength="12" placeholder="예: 3반 1모둠"></label>
        <label class="f">비밀번호 (선택)<input id="in-roompw" maxlength="8" placeholder="없으면 비워 두세요"></label>
      </div>
      <div id="create-settings"></div>
      <p class="hint">처음 하는 반이라면 <b>첫 등록 20점 · 조커 없음 · 시작 패 10개</b>를 추천해요.</p>
      <button class="primary" id="btn-create">방 만들기</button>
    </div>

    <div id="tab-join" class="panel hidden">
      <label class="f">방 코드 (숫자 4자리)<input id="in-code" inputmode="numeric" maxlength="4" placeholder="1234"></label>
      <label class="f">비밀번호 (있으면)<input id="in-joinpw" maxlength="8"></label>
      <button class="primary" id="btn-join">입장하기</button>
    </div>

    <div id="tab-local" class="panel hidden">
      <p class="hint">인터넷 없이 한 화면에서 번갈아 해 보는 연습 모드예요. 1명이면 혼자 연습할 수 있어요. 차례가 바뀔 때마다 화면이 가려져서 서로의 패를 볼 수 없어요.</p>
      <div id="local-settings"></div>
      <button class="primary" id="btn-local">연습 시작</button>
    </div>

    <p id="net-status" class="hint"></p>
    <button class="ghost" id="btn-help-home">규칙 보기</button>
  </div>
</section>

<!-- 대기실 -->
<section id="s-lobby" class="screen hidden">
  <div class="card">
    <div class="hint">방 코드</div>
    <div class="big" id="lb-code">0000</div>
    <div id="lb-name" class="hint"></div>
    <div class="row" style="margin:6px 0 10px">
      <button id="lb-copy">초대 링크 복사</button>
    </div>
    <div id="lb-seats"></div>
    <div class="panel">
      <h3>방 설정</h3>
      <div id="lb-summary" class="sum"></div>
      <div id="lb-hostbox" class="hidden">
        <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">설정 바꾸기</summary>
          <div id="lb-settings"></div>
          <button id="lb-save">설정 저장</button>
        </details>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="lb-start">게임 시작</button>
      <button class="ghost" id="lb-leave">나가기</button>
    </div>
    <p id="lb-wait" class="hint"></p>
  </div>
</section>

<!-- 게임 -->
<section id="s-game" class="screen hidden">
  <div class="top">
    <span id="g-code" class="hint"></span>
    <span id="g-turn" class="turn"></span>
    <span class="sp"></span>
    <span id="g-tt" class="tm"></span>
    <span id="g-total" class="hint"></span>
    <span id="g-pool" class="hint"></span>
    <button class="ghost" id="b-menu" style="padding:5px 10px">메뉴</button>
  </div>
  <div id="opps" class="opps"></div>
  <div id="board" class="board"></div>
  <div class="bottom">
    <div id="msg" class="msg"></div>
    <div class="ctl">
      <button class="primary" id="b-end">차례 종료 ✔</button>
      <button id="b-undo">되돌리기 ↶</button>
      <button id="b-draw">타일 뽑고 넘기기</button>
      <button id="b-sortc" class="ghost">색 정렬</button>
      <button id="b-sortn" class="ghost">숫자 정렬</button>
      <button id="b-force" class="danger hidden">끊긴 사람 넘기기</button>
    </div>
    <div id="rack" class="rack"></div>
  </div>
</section>

<!-- 결과 -->
<section id="s-result" class="screen hidden">
  <div class="card">
    <h1>게임 끝!</h1>
    <p id="rs-reason" class="hint"></p>
    <div id="rs-list"></div>
    <div class="row">
      <button class="primary" id="rs-again">다시 하기</button>
      <button class="ghost" id="rs-leave">나가기</button>
    </div>
    <p id="rs-wait" class="hint"></p>
  </div>
</section>

<div id="cover" class="hidden"></div>
<div id="modal" class="hidden"><div class="box" id="modal-box"></div></div>
<div id="toast"></div>

<script>

<script>/*!
 * 루미큐브 규칙 엔진 (rk-engine.js)
 * - 화면·네트워크와 무관한 순수 함수 모음. 나중에 단일 HTML 안에 그대로 붙여 넣어 쓴다.
 * - 타일은 정수 id 하나로 표현한다(Firebase에 그대로 저장하기 좋음).
 *     id 0~103  : 숫자 타일 (복사본 2벌)  → 색 = floor((id%52)/13), 숫자 = id%13 + 1
 *     id 104,105: 조커
 * - 세트는 id 배열. 런(연속)은 "배열 순서"가 곧 왼쪽→오른쪽 순서다.
 * - 테이블은 세트의 배열: [[id,id,id], [id,id,id,id], ...]
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RK = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const COLOR_NAMES = ['빨강', '파랑', '노랑', '검정'];
  const JOKER_FIRST = 104;
  const TOTAL_TILES = 106;
  const JOKER_PENALTY = 30;

  /* ---------- 타일 기본 ---------- */
  const isJoker = (id) => id >= JOKER_FIRST;
  const colorOf = (id) => (isJoker(id) ? -1 : Math.floor((id % 52) / 13));
  const numOf = (id) => (isJoker(id) ? 0 : (id % 13) + 1);
  const tileInfo = (id) => ({ id, joker: isJoker(id), color: colorOf(id), number: numOf(id) });
  /** 테스트·디버깅용: makeTile(색0~3, 숫자1~13, 복사본0|1) */
  const makeTile = (color, number, copy) => (copy || 0) * 52 + color * 13 + (number - 1);

  /** jokers: 조커 개수(0~2, 기본 2) */
  function createDeck(jokers) {
    const j = jokers == null ? 2 : jokers;
    const deck = [];
    for (let i = 0; i < 104; i++) deck.push(i);
    for (let k = 0; k < j; k++) deck.push(JOKER_FIRST + k);
    return deck;
  }

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    const r = rng || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- 세트 판정 ---------- */
  function evalRun(ids) {
    const len = ids.length;
    if (len < 3 || len > 13) return null;
    let color = null;
    let start = null;
    for (let i = 0; i < len; i++) {
      const id = ids[i];
      if (isJoker(id)) continue;
      const c = colorOf(id);
      const s = numOf(id) - i; // 이 위치가 시작 숫자라면 필요한 값
      if (color === null) {
        color = c;
        start = s;
      } else if (c !== color || s !== start) return null;
    }
    if (color === null) return null; // 조커만 있는 런은 불가
    if (start < 1 || start + len - 1 > 13) return null; // 13 다음 1로 이어지는 것도 불가
    let points = 0;
    for (let i = 0; i < len; i++) points += start + i;
    return { kind: 'run', points, color, start };
  }

  function evalGroup(ids) {
    const len = ids.length;
    if (len < 3 || len > 4) return null;
    let num = null;
    const colors = new Set();
    for (const id of ids) {
      if (isJoker(id)) continue;
      const n = numOf(id);
      if (num === null) num = n;
      else if (n !== num) return null;
      const c = colorOf(id);
      if (colors.has(c)) return null;
      colors.add(c);
    }
    if (num === null) return null; // 조커만 있는 그룹은 불가
    return { kind: 'group', points: num * len, number: num };
  }

  function explainInvalid(ids) {
    const len = ids.length;
    if (len < 3) return '타일이 3장 이상 있어야 해요';
    const real = ids.filter((id) => !isJoker(id));
    if (real.length === 0) return '조커만으로는 세트를 만들 수 없어요';
    const nums = new Set(real.map(numOf));
    const cols = new Set(real.map(colorOf));
    if (nums.size === 1) {
      if (len > 4) return '그룹은 최대 4장까지예요';
      if (cols.size < real.length) return '그룹에는 같은 색이 두 번 들어갈 수 없어요';
    }
    if (cols.size === 1) return '같은 색이지만 숫자가 이어지지 않아요 (1~13, 13 다음에 1은 안 돼요)';
    return '같은 색 연속 숫자(런)도, 같은 숫자 다른 색(그룹)도 아니에요';
  }

  /** 세트 하나를 판정. 런·그룹 둘 다 가능하면 점수가 높은 쪽을 택한다. */
  function validateSet(ids) {
    if (new Set(ids).size !== ids.length) {
      return { valid: false, reason: '같은 타일이 중복되어 있어요' };
    }
    const run = evalRun(ids);
    const group = evalGroup(ids);
    let best = null;
    if (run && group) best = run.points >= group.points ? run : group;
    else best = run || group;
    if (!best) return { valid: false, reason: explainInvalid(ids) };
    return Object.assign({ valid: true }, best);
  }

  const compact = (table) => table.filter((s) => s.length > 0);

  function validateTable(table) {
    const sets = compact(table);
    const results = sets.map(validateSet);
    const bad = [];
    results.forEach((r, i) => {
      if (!r.valid) bad.push(i);
    });
    return { ok: bad.length === 0, results, bad };
  }

  /* ---------- 차례 검증 ---------- */
  const err = (code, message, extra) => Object.assign({ ok: false, code, message }, extra || {});
  const flat = (table) => table.reduce((a, s) => a.concat(s), []);
  const keyOf = (set) => set.slice().sort((a, b) => a - b).join(',');

  /**
   * 한 차례의 결과가 규칙에 맞는지 검사한다.
   * @param {object} p
   *   tableBefore/tableAfter : 차례 시작/종료 시 테이블

    const after = flat(tableAfter);

    }

    const beforeSet = new Set(before);
    const placed = after.filter((id) => !beforeSet.has(id));
    const handBeforeSet = new Set(p.handBefore);
    for (const id of placed) {
      if (!handBeforeSet.has(id)) return err('FOREIGN_TILE', '내 패에 없던 타일이 테이블에 올라왔어요');
    }
    const placedSet = new Set(placed);
    const expectedHand = p.handBefore.filter((id) => !placedSet.has(id));
    const handAfterSet = new Set(p.handAfter);
    if (expectedHand.length !== p.handAfter.length || expectedHand.some((id) => !handAfterSet.has(id))) {

      for (const s of tableBefore) {

        left.set(k, (left.get(k) || 0) + 1);
      }
      const untouchedLeft = new Map(left);
      const newSets = [];
      for (const s of tableAfter) {
        const k = keyOf(s);
        if ((untouchedLeft.get(k) || 0) > 0) untouchedLeft.set(k, untouchedLeft.get(k) - 1);

      }
      for (const n of untouchedLeft.values()) {

  /**
   * 첫 등록 점수를 실시간으로 계산: 테이블 세트가 그대로인 것은 제외하고 새로 만든 세트의 합.

    let newCount = 0;
    for (const s of compact(tableAfter)) {
      const k = keyOf(s);
      if ((left.get(k) || 0) > 0) left.set(k, left.get(k) - 1);

      found = true;

      for (let i = 0; i < table.length && !found; i++) {

        if (k >= 0) {
          table[i].splice(k, 1);

        }

    if (dest.beforeId === id) return null;

      if (k < 0) arr.push(id);

      players,
      jokers,
      handSize,
      minMeld: o.minMeld == null ? 30 : o.minMeld,
      hands,
      pool: deck,
      table: [],
      turn: 0,
      melded: new Array(players).fill(false),
      passes: 0, // 더미가 빈 뒤 연속으로 넘긴 횟수
      over: false,
      winner: null,
      endReason: null, // 'empty' | 'stalemate' | 'timeup'
    };
  }

  const nextTurn = (s) => (s.turn + 1) % s.players;

  /** 낼 수 없을 때: 1장 뽑고 차례 넘김(더미가 비었으면 그냥 넘김) */
  function drawAndPass(state) {
    if (state.over) return { ok: false, code: 'OVER', message: '이미 끝난 게임이에요' };
    const s = clone(state);
    if (s.pool.length > 0) {
      s.hands[s.turn].push(s.pool.shift());
      s.passes = 0;
    } else {
      s.passes += 1;
    }
    if (s.pool.length === 0 && s.passes >= s.players) return { ok: true, state: finishByScore(s, 'stalemate') };
    s.turn = nextTurn(s);
    return { ok: true, state: s };
  }

  /** 차례 종료: 검사 통과 시 상태를 갱신 */
  function commitTurn(state, newTable, newHand) {
    if (state.over) return { ok: false, code: 'OVER', message: '이미 끝난 게임이에요' };
    const v = validateTurn({
      tableBefore: state.table,
      handBefore: state.hands[state.turn],
      tableAfter: newTable,
      handAfter: newHand,
      melded: state.melded[state.turn],
      minMeld: state.minMeld,
    });
    if (!v.ok) return v;
    const s = clone(state);
    s.table = compact(newTable);
    s.hands[s.turn] = newHand.slice();
    s.melded[s.turn] = true;
    s.passes = 0;
    if (newHand.length === 0) {
      s.over = true;
      s.winner = s.turn;
      s.endReason = 'empty';
      return { ok: true, state: s, result: v };
    }
    s.turn = nextTurn(s);
    return { ok: true, state: s, result: v };
  }

  /** 교착·시간종료: 감점이 가장 낮은 사람이 승리(동점이면 타일 수가 적은 사람 → 번호가 빠른 사람) */
  function finishByScore(state, reason) {
    const s = clone(state);
    const pen = s.hands.map(handPenalty);
    let w = 0;
    for (let i = 1; i < s.players; i++) {
      if (pen[i] < pen[w] || (pen[i] === pen[w] && s.hands[i].length < s.hands[w].length)) w = i;
    }
    s.over = true;
    s.winner = w;
    s.endReason = reason;
    return s;
  }

  return {
    COLOR_NAMES, TOTAL_TILES, JOKER_PENALTY,
    isJoker, colorOf, numOf, tileInfo, makeTile,
    createDeck, shuffle, mulberry32,
    validateSet, validateTable, validateTurn,
    meldPointsOf, moveTile,
    handPenalty, roundScores, sortHand,
    newGame, drawAndPass, commitTurn, finishByScore,
  };
});

<script>/*!

 *     get(path) → Promise<값|null>

 *   rummikub/rooms/{코드}/game   진행 상태 (배열은 JSON 문자열로 저장해 Firebase 배열 변환 문제를 피함)
 *   rummikub/rooms/{코드}/poolJson   남은 타일 더미(섞인 순서)

        winner: -1,
        endReason: 'none',
        scoresJson: 'null',
        finalHandsJson: 'null',
      };
      upd[base() + '/meta/status'] = 'playing';
      await fb.update('', upd);
    }

    async function rematch() {
      const v = buildView();
      if (!v.isHost || v.status !== 'over') return;
      const upd = {};
      upd[base() + '/meta/status'] = 'lobby';
      upd[base() + '/game'] = null;
      upd[base() + '/poolJson'] = null;
      upd['rummikub/hands/' + code] = null;
      await fb.update('', upd);
    }

    async function leave() {
      const v = buildView();
      const c = code;
      const s = seat;
      // 먼저 구독을 끊는다 (끊지 않으면 '접속 중'으로 되돌리는 코드가 다시 돌아 자리가 계속 접속 상태로 남음)
      detach();
      code = null;
      seat = null;
      emit();
      if (!c || s == null) return;
      if (v.status === 'lobby') {
        await fb.set(base(c) + '/seats/' + s, null);
        if (v.isHost) {
          const others = await fb.get(base(c) + '/seats');
          const ids = others ? Object.keys(others) : [];
          const upd = {};
          if (ids.length === 0) {
            upd[base(c)] = null;
            upd['rummikub/hands/' + c] = null;
          } else {
            upd[base(c) + '/meta/hostCid'] = others[ids[0]].cid;
          }
          await fb.update('', upd);
        }
      } else {
        try {
          await fb.set(base(c) + '/seats/' + s + '/online', false);
        } catch (e) {}
      }
    }

    /* ----- 게임 진행 ----- */
    async function readAllHands(n, overrideSeat, overrideHand) {
      const out = [];
      for (let i = 0; i < n; i++) {
        if (i === overrideSeat) out.push(overrideHand);
        else {
          const s = await fb.get(handPath(i));
          out.push(s ? P(s) : []);
        }
      }
      return out;
    }

    /** 차례 끝내기: 규칙 검사 → 테이블/차례 갱신 → 내 패 저장 */
    async function commit(table, hand) {
      const v = buildView();
      const g = v.game;
      if (!g || v.status !== 'playing' || g.turn !== seat) return { ok: false, message: '지금은 내 차례가 아니에요' };
      const chk = RK.validateTurn({
        tableBefore: g.table,
        handBefore: v.myHand,
        tableAfter: table,
        handAfter: hand,
        melded: g.melded[seat],
        minMeld: v.settings.minMeld,
      });
      if (!chk.ok) return { ok: false, message: chk.message, badSets: chk.badSets, code: chk.code };

      const players = v.settings.players;
      const compactTable = table.filter((s) => s.length > 0);
      const counts = g.counts.slice();
      counts[seat] = hand.length;
      const melded = g.melded.slice();
      melded[seat] = true;
      let over = null;
      if (hand.length === 0) {
        const hands = await readAllHands(players, seat, hand);
        over = { scores: RK.roundScores(hands, seat), hands };
      }
      const t = now();
      const prevHand = myHandStr;
      myHandStr = J(hand); // 화면 깜빡임 방지: 내 패를 먼저 반영
      const res = await fb.transaction(base() + '/game', (cur) => {
        if (!cur || cur.seq !== g.seq || cur.turn !== seat) return undefined;
        const n = Object.assign({}, cur, {
          seq: cur.seq + 1,
          tableJson: J(compactTable),
          meldedJson: J(melded),
          countsJson: J(counts),
          passes: 0,
          lastPlacedJson: J(chk.placed),
        });
        if (over) {
          n.winner = seat;
          n.endReason = 'empty';
          n.scoresJson = J(over.scores);
          n.finalHandsJson = J(over.hands);
        } else {
          n.turn = (seat + 1) % players;
          n.turnStartedAt = t;
        }
        return n;
      });
      if (!res.committed) {
        myHandStr = prevHand;
        emit();
        return { ok: false, message: '그 사이에 차례가 바뀌었어요 (시간이 지났을 수 있어요)' };
      }
      const upd = {};
      upd[handPath(seat)] = J(hand);
      if (over) upd[base() + '/meta/status'] = 'over';
      await fb.update('', upd);
      return { ok: true };
    }

    /** target 자리의 차례를 "1장 뽑고 넘김"으로 처리 (본인 또는 대신 넘겨주는 사람이 호출) */
    async function passFor(target) {
      const v = buildView();
      const g = v.game;
      if (!g || v.status !== 'playing' || g.turn !== target) return { ok: false, message: '지금은 그 사람의 차례가 아니에요' };
      const st = v.settings;
      const pool = v.pool;
      const drawId = g.poolPos < pool.length ? pool[g.poolPos] : null;
      let hand;
      if (target === seat) hand = v.myHand.slice();
      else {
        const s = await fb.get(handPath(target));
        hand = s ? P(s) : [];
      }
      const newHand = drawId !== null ? hand.concat([drawId]) : hand;
      let over = null;
      if (drawId === null && g.passes + 1 >= st.players) {
        const hands = await readAllHands(st.players, target, newHand);
        const fin = RK.finishByScore({ players: st.players, hands }, 'stalemate');
        over = { winner: fin.winner, scores: RK.roundScores(hands, fin.winner), hands };
      }
      const counts = g.counts.slice();
      if (drawId !== null) counts[target] += 1;
      const t = now();
      const prevHand = myHandStr;
      if (target === seat && drawId !== null) myHandStr = J(newHand);
      const res = await fb.transaction(base() + '/game', (cur) => {
        if (!cur || cur.seq !== g.seq || cur.turn !== target) return undefined;
        const n = Object.assign({}, cur, {
          seq: cur.seq + 1,
          countsJson: J(counts),
          lastPlacedJson: '[]',
          poolPos: cur.poolPos + (drawId !== null ? 1 : 0),
          passes: drawId !== null ? 0 : cur.passes + 1,
        });
        if (over) {
          n.winner = over.winner;
          n.endReason = 'stalemate';
          n.scoresJson = J(over.scores);
          n.finalHandsJson = J(over.hands);
        } else {
          n.turn = (target + 1) % st.players;
          n.turnStartedAt = t;
        }
        return n;
      });
      if (!res.committed) {
        myHandStr = prevHand;
        emit();
        return { ok: false, message: '그 사이에 차례가 바뀌었어요' };
      }
      const upd = {};
      if (drawId !== null) upd[handPath(target)] = J(newHand);
      if (over) upd[base() + '/meta/status'] = 'over';
      if (Object.keys(upd).length) await fb.update('', upd);
      return { ok: true, drew: drawId !== null };
    }

    /** 시간 종료/방장 종료: 감점이 가장 낮은 사람이 승리 */
    async function finishByScore(reason) {
      const v = buildView();
      const g = v.game;
      if (!g || v.status !== 'playing') return { ok: false };
      const st = v.settings;
      const hands = await readAllHands(st.players, null, null);
      const fin = RK.finishByScore({ players: st.players, hands }, reason);
      const scores = RK.roundScores(hands, fin.winner);
      const res = await fb.transaction(base() + '/game', (cur) => {
        if (!cur || cur.seq !== g.seq || cur.winner !== -1) return undefined;
        return Object.assign({}, cur, {
          seq: cur.seq + 1,
          winner: fin.winner,
          endReason: reason,
          scoresJson: J(scores),
          finalHandsJson: J(hands),
        });
      });
      if (!res.committed) return { ok: false };
      const upd = {};
      upd[base() + '/meta/status'] = 'over';
      await fb.update('', upd);
      return { ok: true };
    }

    /** 1초마다 불러 주세요: 내 시간초과 처리, 끊긴 사람 대신 넘기기, 총 제한시간 종료 */
    function tick() {
      if (busy || seat == null) return;
      const v = buildView();
      if (v.status !== 'playing' || !v.game) return;
      const g = v.game;
      const st = v.settings;
      const t = now();
      const online = [];
      v.seats.forEach((s, i) => {
        if (s && s.online) online.push(i);
      });
      const lowest = (ex) => {
        const c = online.filter((i) => i !== ex);
        return c.length ? Math.min.apply(null, c) : -1;
      };
      let job = null;
      if (g.endsAt && t >= g.endsAt && seat === lowest(-1)) job = () => finishByScore('timeup');
      else if (st.turnSec > 0) {
        const dl = g.turnStartedAt + st.turnSec * 1000;
        if (g.turn === seat && t >= dl) job = () => passFor(seat);
        else if (g.turn !== seat && t >= dl + GRACE_MS && seat === lowest(g.turn)) job = () => passFor(g.turn);
      }
      if (job) {
        busy = true;
        Promise.resolve(job())
          .catch(() => {})
          .then(() => {
            busy = false;
          });
      }
    }

    return {
      createRoom, joinRoom, resume, leave,
      updateSettings, kick, startGame, rematch,
      commit,
      drawPass: () => passFor(seat),
      forcePass: () => {
        const v = buildView();
        return v.isHost && v.game ? passFor(v.game.turn) : Promise.resolve({ ok: false });
      },
      endGame: () => {
        const v = buildView();
        return v.isHost ? finishByScore('host') : Promise.resolve({ ok: false });
      },
      tick,
      now,
      getView: buildView,
      subscribe: (f) => {
        subs.add(f);
        return () => subs.delete(f);
      },
      get code() { return code; },
      get seat() { return seat; },
    };
  }

  return { createNet, sanitizeSettings };
});
</script>
<script>
(function () {
  'use strict';
  const RK = window.RK, NET = window.RKNet;
  const $ = (s) => document.querySelector(s);
  const J = JSON.stringify;
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const SYM = ['●', '▲', '■', '◆'];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const cid = (function () {
    let c = store.get('rk_cid');
    if (!c) { c = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set('rk_cid', c); }
    return c;
  })();

  let ctl = null;          // 현재 컨트롤러(온라인 net 또는 로컬)
  let unsub = null;
  let view = null;
  let work = null;         // {table, hand} 내 차례의 작업 상태
  let workKey = '';
  let lastSeat = null;
  let lastNotify = -1;
  let acting = false;
  let drag = null;
  let netObj = null;       // 온라인 net (Firebase 준비되면)
  let netReady = false;

  /* ================= 공통 도우미 ================= */
  function toast(msg, ms) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), ms || 2600);
  }
  function showScreen(name) {
    ['home', 'lobby', 'game', 'result'].forEach((n) => $('#s-' + n).classList.toggle('hidden', n !== name));
  }
  function openModal(html) { $('#modal-box').innerHTML = html; $('#modal').classList.remove('hidden'); }
  function closeModal() { $('#modal').classList.add('hidden'); }
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
  const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  const HELP = `<h3>루미큐브 규칙</h3><ul>
    <li><b>목표</b>: 내 타일을 가장 먼저 모두 내려놓기!</li>
    <li><b>런</b>: 같은 색 숫자가 이어진 3장 이상 (예: 파랑 4-5-6). 13 다음에 1은 안 이어져요.</li>
    <li><b>그룹</b>: 같은 숫자, 서로 다른 색 3~4장 (예: 7 빨강·파랑·검정).</li>
    <li><b>조커(★)</b>는 아무 타일 대신 쓸 수 있어요.</li>
    <li><b>첫 등록</b>: 내 타일만으로 세트를 만들고 합이 정해진 점수(기본 30점) 이상이어야 해요. 이때는 테이블 세트를 건드릴 수 없어요.</li>
    <li>등록 후에는 테이블의 세트를 <b>쪼개고 합치고 옮겨서</b> 다시 배치할 수 있어요. 단, 차례를 끝낼 때 <b>모든 세트가 올바라야</b> 해요.</li>
    <li>낼 수 없으면 타일 1장을 뽑고 차례를 넘겨요.</li>
    <li>끝나면 남은 타일의 숫자 합(조커 30)이 감점이에요.</li>
    <li><b>조작</b>: 타일을 끌어서(드래그) 옮겨요. 빈 곳에 놓으면 새 세트가 돼요. 초록 테두리 = 올바른 세트, 빨강 = 틀린 세트.</li></ul>
    <button id="m-close" class="primary">닫기</button>`;
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'm-close') closeModal(); });

  /* ================= 설정 폼 ================= */
  const FIELDS = [
    { k: 'players', label: '인원', opts: [[2, '2명'], [3, '3명'], [4, '4명']], solo: [[1, '1명 (혼자)'], [2, '2명'], [3, '3명'], [4, '4명']], def: 4 },
    { k: 'minMeld', label: '첫 등록 점수', opts: [[0, '없음 (0점)'], [20, '20점'], [30, '30점 (기본)']], def: 30 },
    { k: 'turnSec', label: '차례 시간', opts: [[60, '60초'], [90, '90초 (기본)'], [120, '120초'], [0, '제한 없음']], def: 90 },
    { k: 'totalMin', label: '전체 제한 시간', opts: [[0, '없음'], [20, '20분'], [30, '30분 (기본)'], [40, '40분']], def: 30 },
    { k: 'handSize', label: '시작 패 개수', opts: [[10, '10개 (짧게)'], [14, '14개 (기본)']], def: 14 },
    { k: 'jokers', label: '조커', opts: [[2, '2개 (기본)'], [0, '없음']], def: 2 },
  ];
  function settingsHTML(pre, solo, vals) {
    return '<div class="grid2">' + FIELDS.map((f) => {
      const cur = vals && vals[f.k] != null ? vals[f.k] : (solo && f.k === 'players' ? 1 : f.def);
      const opts = (solo && f.solo ? f.solo : f.opts).map((o) => `<option value="${o[0]}" ${o[0] === cur ? 'selected' : ''}>${o[1]}</option>`).join('');
      return `<label class="f">${f.label}<select id="${pre}-${f.k}">${opts}</select></label>`;
    }).join('') + '</div>';
  }
  function readSettings(pre) {
    const o = {};
    FIELDS.forEach((f) => { o[f.k] = Number($('#' + pre + '-' + f.k).value); });
    return o;
  }
  function summaryHTML(s) {
    const t = (n, z) => (n ? n + z : '없음');
    return [
      ['인원', s.players + '명'], ['첫 등록', s.minMeld ? s.minMeld + '점' : '없음'],
      ['차례 시간', s.turnSec ? s.turnSec + '초' : '제한 없음'], ['전체 시간', t(s.totalMin, '분')],
      ['시작 패', s.handSize + '개'], ['조커', s.jokers ? s.jokers + '개' : '없음'],
    ].map((r) => `<span>${r[0]}</span><span>${r[1]}</span>`).join('');
  }
  $('#create-settings').innerHTML = settingsHTML('cs', false, { minMeld: 30 });
  $('#local-settings').innerHTML = settingsHTML('ls', true);

  /* ================= 로컬(한 화면) 컨트롤러 ================= */
  function makeLocal(settings) {
    const st = NET.sanitizeSettings(settings, true);
    let state, cover, seq, t0, endsAt, lastPlaced;
    const subs = new Set();
    const names = [];
    for (let i = 0; i < st.players; i++) names.push(st.players > 1 ? '플레이어 ' + (i + 1) : '나');
    function init() {
      state = RK.newGame({ players: st.players, minMeld: st.minMeld, jokers: st.jokers, handSize: st.handSize });
      cover = st.players > 1; seq = 1; t0 = Date.now(); lastPlaced = [];
      endsAt = st.totalMin ? Date.now() + st.totalMin * 60000 : 0;
    }
    init();
    function getView() {
      const over = state.over;
      const seat = over ? 0 : state.turn;
      return {
        code: null, roomName: '', hasPw: false, settings: st, local: true,
        status: over ? 'over' : 'playing', seats: names.map((n) => ({ name: n, online: true })),
        mySeat: seat, isHost: true, cover: cover && !over, myHand: state.hands[seat].slice(), pool: null,
        game: {
          seq, turn: state.turn, turnStartedAt: t0, endsAt, table: state.table, melded: state.melded,
          counts: state.hands.map((h) => h.length), poolLeft: state.pool.length, passes: state.passes, lastPlaced,
          winner: over ? state.winner : -1, endReason: over ? state.endReason : 'none',
          scores: over ? RK.roundScores(state.hands, state.winner) : null, finalHands: over ? state.hands : null,
        },
      };
    }
    function emit() { const v = getView(); subs.forEach((f) => f(v)); }
    function after() { seq++; t0 = Date.now(); cover = st.players > 1 && !state.over; emit(); }
    return {
      getView, now: () => Date.now(),
      subscribe: (f) => { subs.add(f); return () => subs.delete(f); },
      async commit(table, hand) {
        const r = RK.commitTurn(state, table, hand);
        if (!r.ok) return { ok: false, message: r.message, badSets: r.badSets, code: r.code };
        state = r.state; lastPlaced = r.result.placed; after(); return { ok: true };
      },
      async drawPass() { const r = RK.drawAndPass(state); state = r.state; lastPlaced = []; after(); return { ok: true }; },
      reveal() { cover = false; t0 = Date.now(); emit(); },
      tick() {
        if (state.over || cover) return;
        const t = Date.now();
        if (endsAt && t >= endsAt) { state = RK.finishByScore(state, 'timeup'); after(); return; }
        if (st.turnSec && t >= t0 + st.turnSec * 1000) { const r = RK.drawAndPass(state); state = r.state; lastPlaced = []; after(); }
      },
      async endGame() { if (!state.over) { state = RK.finishByScore(state, 'host'); after(); } },
      async rematch() { init(); emit(); },
      async leave() {},
      forcePass() {},
      _debugSetHand(seat, hand) { state.hands[seat] = hand.slice(); emit(); },
    };
  }

  /* ================= 화면 연결 ================= */
  function attach(c) {
    if (unsub) unsub();
    ctl = c;
    unsub = c.subscribe(onView);
    onView(c.getView());
  }
  function goHome(msg) {
    if (unsub) unsub();
    unsub = null; ctl = null; view = null; work = null; workKey = ''; lastSeat = null;
    store.del('rk_sess');
    $('#cover').classList.add('hidden');
    closeModal();
    showScreen('home');
    if (msg) toast(msg);
  }

  function onView(v) {
    if (v.status === 'loading') return; // 방 데이터를 처음 받아오는 중
    view = v;
    if (v.status === 'gone') { goHome('방이 없어졌어요'); return; }
    if (v.status === 'lobby') { work = null; workKey = ''; showScreen('lobby'); renderLobby(); }
    else if (v.status === 'playing') { showScreen('game'); syncWork(); renderGame(); }
    else if (v.status === 'over') { work = null; workKey = ''; showScreen('result'); renderResult(); }
    if (v.code && v.mySeat != null && !v.local) store.set('rk_sess', J({ code: v.code, seat: v.mySeat }));
  }

  function mergeOrder(sh) {
    const set = new Set(sh);
    const kept = (work ? work.hand : []).filter((id) => set.has(id));
    const ks = new Set(kept);
    return kept.concat(sh.filter((id) => !ks.has(id)));
  }
  function syncWork() {
    const g = view.game;
    if (!g || view.mySeat == null) return;
    if (view.mySeat !== lastSeat) { work = null; lastSeat = view.mySeat; }
    const key = g.seq + '|' + J(view.myHand) + '|' + view.mySeat;
    if (key !== workKey || !work) {
      workKey = key;
      const hand = work ? mergeOrder(view.myHand) : RK.sortHand(view.myHand, 'color');
      work = { table: clone(g.table), hand };
      showMsg('');
    }
    // 내 차례 알림
    if (view.mySeat === g.turn && g.seq !== lastNotify && !view.local && g.winner === -1) {
      lastNotify = g.seq;
      toast('내 차례예요!', 1800);
      try { navigator.vibrate && navigator.vibrate(150); } catch (e) {}
    }
  }

  /* ================= 대기실 ================= */
  let lbKey = '';
  function renderLobby() {
    const v = view;
    $('#lb-code').textContent = v.code;
    $('#lb-name').textContent = [v.roomName, v.hasPw ? '비밀번호 방' : ''].filter(Boolean).join(' · ');
    $('#lb-seats').innerHTML = v.seats.map((s, i) => s
      ? `<div class="seat ${s.online ? '' : 'off'}"><span class="dot"></span><span class="nm">${esc(s.name)}${i === v.mySeat ? ' (나)' : ''}${i === 0 ? ' 👑' : ''}</span>${v.isHost && i !== v.mySeat ? `<button data-kick="${i}" class="ghost" style="padding:4px 10px">내보내기</button>` : ''}</div>`
      : `<div class="seat empty"><span class="dot"></span><span class="nm">기다리는 중…</span></div>`).join('');
    $('#lb-summary').innerHTML = summaryHTML(v.settings);
    $('#lb-hostbox').classList.toggle('hidden', !v.isHost);
    const k = J(v.settings);
    if (k !== lbKey) { lbKey = k; $('#lb-settings').innerHTML = settingsHTML('lb', false, v.settings); }
    const full = v.seats.every(Boolean);
    $('#lb-start').classList.toggle('hidden', !v.isHost);
    $('#lb-start').disabled = !full;
    $('#lb-wait').textContent = v.isHost ? (full ? '모두 모였어요! 시작하세요.' : '친구들이 방 코드를 입력하면 자리가 채워져요.') : '방장이 시작하기를 기다리는 중이에요…';
  }
  $('#lb-seats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-kick]');
    if (b) ctl.kick(Number(b.dataset.kick)).catch((er) => toast(er.message));
  });
  $('#lb-save').onclick = async () => {
    try { await ctl.updateSettings(readSettings('lb')); toast('설정을 바꿨어요'); } catch (e) { toast(e.message); }
  };
  $('#lb-start').onclick = async () => { try { await ctl.startGame(); } catch (e) { toast(e.message); } };
  $('#lb-leave').onclick = async () => { await ctl.leave(); goHome(); };
  $('#lb-copy').onclick = async () => {
    const url = location.origin + location.pathname + '?room=' + view.code;
    try { await navigator.clipboard.writeText(url); toast('초대 링크를 복사했어요'); } catch (e) { toast(url, 6000); }
  };

  /* ================= 게임 화면 ================= */
  function tileHTML(id, cls) {
    if (RK.isJoker(id)) return `<div class="tile joker ${cls || ''}" data-id="${id}"><span class="n">★</span><small>조커</small></div>`;
    const c = RK.colorOf(id);
    return `<div class="tile c${c} ${cls || ''}" data-id="${id}"><span class="n">${RK.numOf(id)}</span><small>${SYM[c]}</small></div>`;
  }
  const myTurn = () => !!(view && view.game && view.status === 'playing' && view.mySeat === view.game.turn && !view.cover);
  const isDirty = () => !!(work && view.game && (J(work.table) !== J(view.game.table) || work.hand.length !== view.myHand.length));
  function showMsg(t, kind) {
    const m = $('#msg');
    m.textContent = t || '';
    m.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function renderGame() {
    const v = view, g = v.game;
    if (!g || !work) return;
    // 가림막 (한 화면 연습)
    const cv = $('#cover');
    if (v.cover) {
      cv.innerHTML = `<div class="box"><h2>${esc(v.seats[v.mySeat].name)} 차례</h2><p class="hint">다른 사람은 화면을 보지 마세요.<br>준비되면 아래 버튼을 눌러요.</p><button class="primary" id="cv-go">내 패 보기</button></div>`;
      cv.classList.remove('hidden');
    } else cv.classList.add('hidden');

    const mine = myTurn();
    $('#g-code').textContent = v.local ? '연습' : '방 ' + v.code;
    $('#g-pool').textContent = '더미 ' + g.poolLeft;
    const cur = v.seats[g.turn];
    $('#g-turn').textContent = mine ? '내 차례예요!' : (cur ? cur.name : '') + ' 님의 차례';
    $('#g-turn').className = 'turn' + (mine ? ' mine' : '');
    $('#opps').innerHTML = v.seats.map((s, i) =>
      `<div class="opp ${i === g.turn ? 'cur' : ''} ${s && !s.online ? 'off' : ''}"><b>${esc(s ? s.name : '?')}${i === v.mySeat && !v.local ? ' (나)' : ''}</b><span>타일 ${g.counts[i]}개</span><i>${g.melded[i] ? '등록 ✔' : '등록 전'}${s && !s.online ? ' · 끊김' : ''}</i></div>`).join('');
    $('#opps').classList.toggle('hidden', v.seats.length < 2);
    renderBoard(); renderRack(); renderControls(); updateTimers();
  }

  function renderBoard() {
    const g = view.game, mine = myTurn(), dirty = isDirty();
    const recent = new Set(!dirty ? g.lastPlaced : []);
    let h = work.table.map((s, i) => {
      const r = RK.validateSet(s);
      const cls = r.valid ? 'ok' : (s.length < 3 ? 'wip' : 'bad');
      const note = !r.valid && mine ? `<span class="why">${esc(r.reason)}</span>` : '';
      return `<div class="set ${cls}" data-i="${i}">${s.map((id) => tileHTML(id, recent.has(id) ? 'recent' : '')).join('')}${r.valid ? `<span class="pts">${r.points}</span>` : ''}${note}</div>`;
    }).join('');
    if (!work.table.length) h += `<div class="empty">아직 테이블이 비어 있어요.${mine ? '<br>패의 타일을 이곳으로 끌어다 놓아 세트를 만드세요.' : ''}</div>`;
    else if (mine) h += '<div class="newhint">▼ 빈 곳에 놓으면 새 세트가 만들어져요</div>';
    $('#board').innerHTML = h;
    $('#board').classList.toggle('newok', mine);
  }
  function renderRack() {
    $('#rack').innerHTML = work.hand.map((id) => tileHTML(id)).join('');
  }
  function renderControls() {
    const g = view.game, mine = myTurn(), dirty = isDirty();
    $('#b-end').disabled = !(mine && dirty && !acting);
    $('#b-undo').disabled = !(mine && dirty && !acting);
    $('#b-draw').disabled = !(mine && !dirty && !acting);
    $('#b-draw').textContent = g.poolLeft > 0 ? '타일 뽑고 넘기기' : '넘기기 (더미 없음)';
    const off = view.seats[g.turn] && !view.seats[g.turn].online;
    $('#b-force').classList.toggle('hidden', !(view.isHost && !view.local && !mine && off));
    if (!$('#msg').classList.contains('err') && !$('#msg').classList.contains('good')) {
      let t = '';
      if (mine) {
        if (!g.melded[view.mySeat]) {
          const m = RK.meldPointsOf(g.table, work.table);
          t = `첫 등록: 지금 ${m.points}점 / ${view.settings.minMeld}점` + (m.touched ? ' — 첫 등록 전에는 테이블의 세트를 건드릴 수 없어요' : '');
        } else t = dirty ? '다 정리했으면 [차례 종료]를 누르세요' : '타일을 내거나, 낼 수 없으면 [뽑고 넘기기]';
      } else t = '다른 사람의 차례예요. 그동안 내 패를 정리해 두세요';
      $('#msg').textContent = t;
    }
  }
  function updateTimers() {
    if (!view || view.status !== 'playing' || !view.game || !ctl) return;
    const g = view.game, st = view.settings, t = ctl.now();
    const tt = $('#g-tt');
    if (st.turnSec > 0 && !view.cover) {
      const left = Math.max(0, Math.ceil((g.turnStartedAt + st.turnSec * 1000 - t) / 1000));
      tt.textContent = '⏱ ' + left + '초';
      tt.className = 'tm' + (left <= 10 ? ' warn' : '');
    } else tt.textContent = '';
    $('#g-total').textContent = g.endsAt ? '전체 ' + mmss(Math.max(0, Math.ceil((g.endsAt - t) / 1000))) : '';
  }
  setInterval(() => { updateTimers(); if (ctl && ctl.tick) ctl.tick(); }, 1000);

  $('#cover').addEventListener('click', (e) => { if (e.target.id === 'cv-go') ctl.reveal(); });

  async function endTurn() {
    if (acting || !myTurn() || !isDirty()) return;
    acting = true; renderControls();
    try {
      const r = await ctl.commit(work.table, work.hand);
      if (!r.ok) showMsg(r.message, 'err');
      else showMsg('');
    } catch (e) { showMsg('저장하지 못했어요: ' + e.message, 'err'); }
    finally { acting = false; if (view && view.status === 'playing' && work) { renderBoard(); renderControls(); } }
  }
  async function drawPass() {
    if (acting || !myTurn() || isDirty()) return;
    acting = true; renderControls();
    try { const r = await ctl.drawPass(); if (r && r.ok === false && r.message) showMsg(r.message, 'err'); }
    catch (e) { showMsg(e.message, 'err'); }
    finally { acting = false; if (view && view.status === 'playing' && work) renderControls(); }
  }
  function undo() {
    if (!myTurn() || acting) return;
    work = { table: clone(view.game.table), hand: mergeOrder(view.myHand) };
    showMsg(''); renderBoard(); renderRack(); renderControls();
  }
  $('#b-end').onclick = endTurn;
  $('#b-draw').onclick = drawPass;
  $('#b-undo').onclick = undo;
  $('#b-force').onclick = () => ctl.forcePass();
  $('#b-sortc').onclick = () => { if (work) { work.hand = RK.sortHand(work.hand, 'color'); renderRack(); } };
  $('#b-sortn').onclick = () => { if (work) { work.hand = RK.sortHand(work.hand, 'number'); renderRack(); } };
  $('#b-menu').onclick = () => {
    const v = view;
    let h = '<h3>메뉴</h3>';
    if (v.code) h += `<p>방 코드 <b>${esc(v.code)}</b></p>`;
    h += '<button id="m-help">규칙 보기</button>';
    if (v.isHost) h += `<button id="m-end">${v.local ? '여기서 끝내기' : '게임 끝내기 (감점으로 정산)'}</button>`;
    h += `<button id="m-leave" class="danger">${v.local ? '처음으로' : '나가기'}</button><button id="m-close">닫기</button>`;
    openModal(h);
  };
  $('#modal').addEventListener('click', async (e) => {
    const id = e.target.id;
    if (id === 'm-help') openModal(HELP);
    else if (id === 'm-end') { closeModal(); if (confirm('정말 지금 게임을 끝낼까요?')) await ctl.endGame(); }
    else if (id === 'm-leave') {
      closeModal();
      if (confirm(view.local ? '연습을 끝내고 처음으로 갈까요?' : '방에서 나갈까요? (같은 이름으로 다시 들어올 수 있어요)')) { await ctl.leave(); goHome(); }
    }
  });
  $('#btn-help-home').onclick = () => openModal(HELP);

  /* ================= 드래그 ================= */
  function beforeIdIn(container, x, y) {
    const tiles = container.querySelectorAll('.tile:not(.dragging)');
    for (const t of tiles) {
      const r = t.getBoundingClientRect();
      if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) return Number(t.dataset.id);
    }
    return null;
  }
  function findDest(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    if (el.closest('#rack')) return { type: 'hand', beforeId: beforeIdIn($('#rack'), x, y), el: $('#rack') };
    if (!myTurn()) return null;
    const s = el.closest('.set');
    if (s) return { type: 'set', setIndex: Number(s.dataset.i), beforeId: beforeIdIn(s, x, y), el: s };
    if (el.closest('#board')) return { type: 'new', el: $('#board') };
    return null;
  }
  function clearHover() { document.querySelectorAll('.drop-hover').forEach((e) => e.classList.remove('drop-hover')); }

  function onDown(e) {
    if (!work || acting || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const t = e.target.closest('.tile');
    if (!t || t.classList.contains('mini')) return;
    const inBoard = !!t.closest('#board');
    if (inBoard && !myTurn()) return;
    e.preventDefault();
    const r = t.getBoundingClientRect();
    const ghost = t.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
    document.body.appendChild(ghost);
    drag = { id: Number(t.dataset.id), el: t, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, pid: e.pointerId };
    t.classList.add('dragging');
    moveGhost(e.clientX, e.clientY);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }
  function moveGhost(x, y) {
    drag.ghost.style.left = x - drag.dx + 'px';
    drag.ghost.style.top = y - drag.dy + 'px';
  }
  function onMove(e) {
    if (!drag) return;
    moveGhost(e.clientX, e.clientY);
    clearHover();
    const d = findDest(e.clientX, e.clientY);
    if (d && d.el) d.el.classList.add('drop-hover');
    const br = $('#board').getBoundingClientRect();
    if (e.clientY > br.top && e.clientY < br.top + 36) $('#board').scrollTop -= 14;
    else if (e.clientY < br.bottom && e.clientY > br.bottom - 36) $('#board').scrollTop += 14;
  }
  function endDrag() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    if (drag) { drag.ghost.remove(); drag.el.classList.remove('dragging'); }
    clearHover();
  }
  function onCancel() { endDrag(); drag = null; }
  function onUp(e) {
    if (!drag) return;
    const id = drag.id;
    const d = findDest(e.clientX, e.clientY);
    endDrag(); drag = null;
    if (!d) return;
    const locked = new Set(view.game.table.reduce((a, s) => a.concat(s), []));
    if (d.type === 'hand' && locked.has(id)) { showMsg('테이블에 원래 있던 타일은 패로 가져올 수 없어요', 'err'); return; }
    const n = RK.moveTile(work, id, { type: d.type, setIndex: d.setIndex, beforeId: d.beforeId }, locked);
    if (!n) return;
    work = n;
    showMsg('');
    renderBoard(); renderRack(); renderControls();
  }
  $('#board').addEventListener('pointerdown', onDown);
  $('#rack').addEventListener('pointerdown', onDown);

  /* ================= 결과 ================= */
  function renderResult() {
    const v = view, g = v.game;
    const names = v.seats.map((s) => (s ? s.name : '?'));
    const reasons = {
      empty: `${names[g.winner]} 님이 패를 모두 냈어요! 🎉`,
      stalemate: '더 이상 낼 수 있는 사람이 없어서, 감점이 가장 낮은 사람이 이겼어요',
      timeup: '제한 시간이 끝나서, 감점이 가장 낮은 사람이 이겼어요',
      host: '방장이 게임을 끝냈어요 (감점이 가장 낮은 사람이 승리)',
    };
    $('#rs-reason').textContent = reasons[g.endReason] || '';
    const order = names.map((_, i) => i).sort((a, b) => g.scores[b] - g.scores[a]);
    $('#rs-list').innerHTML = order.map((i, rank) => {
      const sc = g.scores[i];
      const hand = (g.finalHands && g.finalHands[i]) || [];
      return `<div class="rank ${i === g.winner ? 'win' : ''}"><div class="hd"><span>${rank + 1}위</span><b>${esc(names[i])}${i === g.winner ? ' 👑' : ''}${i === v.mySeat && !v.local ? ' (나)' : ''}</b><span class="sc ${sc >= 0 ? 'pos' : 'neg'}">${sc > 0 ? '+' : ''}${sc}점</span></div>
        <div class="tiles">${hand.length ? hand.map((id) => tileHTML(id, 'mini')).join('') : '<span class="hint">남은 타일 없음</span>'}</div></div>`;
    }).join('');
    $('#rs-again').classList.toggle('hidden', !v.isHost);
    $('#rs-wait').textContent = v.isHost ? '' : '방장이 다시 시작하면 대기실로 돌아가요.';
  }
  $('#rs-again').onclick = async () => { await ctl.rematch(); };
  $('#rs-leave').onclick = async () => { await ctl.leave(); goHome(); };

  /* ================= 홈: 탭·방 만들기·입장·연습 ================= */
  const nameEl = $('#in-name');
  nameEl.value = store.get('rk_name') || '';
  function getName() {
    const n = nameEl.value.trim();
    if (!n) { toast('이름을 먼저 입력해 주세요'); nameEl.focus(); return null; }
    store.set('rk_name', n);
    return n;
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => selectTab(b.dataset.tab)));
  function selectTab(t) {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x.dataset.tab === t));
    ['create', 'join', 'local'].forEach((n) => $('#tab-' + n).classList.toggle('hidden', n !== t));
  }
  $('#btn-local').onclick = () => {
    $('#cover').classList.add('hidden');
    attach(makeLocal(readSettings('ls')));
  };
  function needNet() {
    if (!netReady) { toast('온라인 연결이 아직 준비되지 않았어요'); return false; }
    return true;
  }
  $('#btn-create').onclick = async () => {
    const name = getName(); if (!name || !needNet()) return;
    try {
      await netObj.createRoom({ name, roomName: $('#in-roomname').value.trim(), pw: $('#in-roompw').value.trim(), settings: readSettings('cs') });
      attach(netObj);
    } catch (e) { toast(e.message); }
  };
  $('#btn-join').onclick = async () => {
    const name = getName(); if (!name || !needNet()) return;
    try {
      await netObj.joinRoom({ code: $('#in-code').value, name, pw: $('#in-joinpw').value.trim() });
      attach(netObj);
    } catch (e) { toast(e.message); }
  };

  /* ================= Firebase 준비 ================= */
  async function initFirebase() {
    if (window.__FB_TEST__) return window.__FB_TEST__;
    const cfg = window.FIREBASE_CONFIG || {};
    if (!cfg.apiKey || !cfg.databaseURL) return null;
    const V = '10.12.2';
    const [A, D] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/' + V + '/firebase-database.js'),
    ]);
    const app = A.initializeApp(cfg);
    const db = D.getDatabase(app);
    const R = (p) => (p ? D.ref(db, p) : D.ref(db));
    return {
      get: async (p) => (await D.get(R(p))).val(),
      set: (p, v) => D.set(R(p), v),
      update: (p, o) => D.update(R(p), o),
      onValue: (p, cb) => D.onValue(R(p), (s) => cb(s.val())),
      transaction: async (p, fn) => { const r = await D.runTransaction(R(p), fn); return { committed: r.committed }; },
      onDisconnectSet: (p, v) => D.onDisconnect(R(p)).set(v),
    };
  }
  (async function boot() {
    const st = $('#net-status');
    const q = new URLSearchParams(location.search).get('room');
    if (q) { selectTab('join'); $('#in-code').value = q.replace(/\D/g, '').slice(0, 4); }
    if (!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey) && !window.__FB_TEST__) {
      st.textContent = '온라인 설정(Firebase)이 아직 없어요. "한 화면 연습"만 할 수 있어요.';
      if (!q) selectTab('local');
      return;
    }
    st.textContent = '온라인 연결 준비 중…';
    try {
      const fb = await initFirebase();
      netObj = NET.createNet(fb, RK, { cid });
      netReady = true;
      st.textContent = '온라인 연결 준비 완료 ✔';
      const sess = store.get('rk_sess');
      if (sess) {
        try { await netObj.resume(JSON.parse(sess)); attach(netObj); toast('이전 방에 다시 연결했어요'); }
        catch (e) { store.del('rk_sess'); }
      }
    } catch (e) {
      st.textContent = '온라인 연결에 실패했어요: ' + e.message;
    }
  })();

  window.__app = { get ctl() { return ctl; }, get work() { return work; }, get view() { return view; } };
})();
</script>
</body>
</html>
